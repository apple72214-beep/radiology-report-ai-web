<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RRai diag</title>
<style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,Tahoma,sans-serif;padding:1.2rem;line-height:1.9;font-size:1.05rem}b{color:#7dd3fc}button{margin:.4rem .3rem;padding:.6rem 1.2rem;border:0;border-radius:.5rem;background:#e2e8f0;color:#0f172a;font-size:1rem;font-family:inherit}</style>
</head>
<body>
<h3>تشخيص Radiology report AI</h3>
<div id="out">جارٍ القراءة…</div>
<div>
<button id="b1" onclick="location.href='./probe.html'">فحص ملف DICOM</button>
<button id="b1b">فتح التطبيق (مسار طازج)</button>
<button id="b2">إلغاء كل SW</button>
<button id="b3">تحديث هذه الصفحة</button>
</div>
<script>
const g = (k) => { try { return localStorage.getItem(k); } catch (e) { return "ERR"; } };
const stage = g("rrai-boot-stage"), err = g("rrai-boot-error"), build = g("rrai-build");
document.getElementById("out").innerHTML =
  "مرحلة الإقلاع الأخيرة: <b>" + (stage || "لا يوجد") + "</b><br>" +
  "خطأ الإقلاع المسجل: <b>" + (err || "لا يوجد") + "</b><br>" +
  "الإصدار المحفوظ: <b>" + (build || "لا يوجد") + "</b><br>" +
  "SW مسجلة: <b id=\"swc\">…</b>";
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((r) => {
  document.getElementById("swc").textContent = r.length + " → " + r.map((x) => x.active ? x.active.scriptURL.split("/").pop() : "no-active").join(", ");
}); else document.getElementById("swc").textContent = "غير مدعوم";
document.getElementById("b1b").onclick = () => location.replace("./r2/start.html");
document.getElementById("b2").onclick = () => navigator.serviceWorker.getRegistrations().then((all) => Promise.all(all.map((r) => r.unregister()))).then(() => { document.getElementById("swc").textContent = "أُلغيت كلها — أعد فتح التطبيق"; });
document.getElementById("b3").onclick = () => location.reload();
const ORIGINS = [
  ["./ (الخادم الأساسي)", "./"],
  ["raw.githubusercontent", "https://raw.githubusercontent.com/apple72214-beep/radiology-report-ai-web/main/"],
  ["cdn.jsdelivr.net", "https://cdn.jsdelivr.net/gh/apple72214-beep/radiology-report-ai-web@main/"],
  ["rawcdn.githack", "https://rawcdn.githack.com/apple72214-beep/radiology-report-ai-web/main/"],
  ["raw.githack", "https://raw.githack.com/apple72214-beep/radiology-report-ai-web/main/"],
  ["api.allorigins (الغلاف الخارجي)", "https://api.allorigins.win/raw?url=https%3A%2F%2Fraw.githubusercontent.com%2Fapple72214-beep%2Fradiology-report-ai-web%2Fmain%2F"]
];
const probe = document.createElement("div");
probe.innerHTML = "<h4 style='margin:.8rem 0 .3rem'>فحص المصادر (release.json)</h4><div id='pr'>جارٍ الفحص…</div>";
document.body.insertBefore(probe, document.querySelector("script"));
const rows = [];
(async () => {
  for (const [label, base] of ORIGINS) {
    const t0 = Date.now();
    let res = "—";
    try {
      const ctl = new AbortController();
      const tm = setTimeout(() => ctl.abort(), 8000);
      const r = await fetch(base + "release.json" + (base.startsWith("http") ? "?cb=" + Date.now() : ""), { cache: "no-store", signal: ctl.signal });
      clearTimeout(tm);
      const txt = await r.text();
      let b = "?";
      try { b = JSON.parse(txt).build; } catch (e) { b = "رد غير JSON (" + txt.slice(0, 40).replace(/</g, "") + ")"; }
      res = r.status + " — build " + b + " — " + (Date.now() - t0) + "ms";
    } catch (e) {
      res = "فشل: " + ((e && e.name) || e) + " — " + (Date.now() - t0) + "ms";
    }
    rows.push(label + ": <b>" + res + "</b>");
    document.getElementById("pr").innerHTML = rows.join("<br>");
  }
  const solo = document.createElement("div");
  solo.innerHTML = "<h4 style='margin:.8rem 0 .3rem'>الملاذ المضمون</h4>" +
    "<a href='./standalone.html' style='color:#38bdf8'>فتح نسخة الملف الواحد</a> — كل الوحدات مضمّنة داخل الصفحة، لا تحتاج أي مصدر خارجي.";
  document.body.insertBefore(solo, document.querySelector("script"));
})();
</script>
</body>
</html>
