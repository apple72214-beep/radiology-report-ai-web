server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index start.html;
  gzip on;
  gzip_types text/html application/javascript text/css application/json application/wasm;
  # versioned assets are immutable; bootstrap & manifests always fresh
  location ~* \.(v[0-9]+)\.(js|html)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location = /release.json { add_header Cache-Control "no-store, no-transform"; }
  location = /sw.js { add_header Cache-Control "no-store, no-transform"; add_header Service-Worker-Allowed "/"; }
  # DICOMweb proxy to the bundled Orthanc with permissive CORS for the workbench
  location /dicom-web/ {
    proxy_pass http://orthanc:8042/dicom-web/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "*" always;
    client_max_body_size 0;
  }
  location / { try_files $uri $uri/ /start.html; }
}
