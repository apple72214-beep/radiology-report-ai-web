server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index start.html index.html;
  gzip on;
  gzip_types text/html text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 1024;

  # release channel + service worker must never be cached by browsers/proxies
  location = /release.json { add_header Cache-Control "no-store"; }
  location = /sw.js        { add_header Cache-Control "no-store"; }
  location = /start.html   { add_header Cache-Control "no-store"; }
  location = /index.html   { add_header Cache-Control "no-store"; }

  # versioned assets are immutable (filename carries the version)
  location ~* \.v[0-9]+\.(js|html)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location ~* \.(wasm|png|ico|webmanifest)$ { add_header Cache-Control "public, max-age=86400"; }

  location / { try_files $uri $uri/ /start.html; }
}
