services:
  rrai-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rrai-web:latest
    container_name: rrai-web
    ports:
      - "8080:80"
    restart: unless-stopped
    # low-resource guard rails for edge boxes
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
