<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RRai diag</title>
<style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,Tahoma,sans-serif;padding:1.2rem;line-height:1.9;font-size:1.05rem}b{color:#7dd3fc}button{margin:.4rem .3rem;padding:.6rem 1.2rem;border:0;border-radius:.5rem;background:#e2e8f0;color:#0f172a;font-size:1rem;font-family:inherit}</style>
</head>
<body>
<h3>تشخيص Radiology report AI</h3>
<div id="out">جارٍ القراءة…</div>
<div>
<button id="b1">فتح التطبيق (مسار طازج)</button>
<button id="b2">إلغاء كل SW</button>
<button id="b3">تحديث هذه الصفحة</button>
</div>
<script>
const g = (k) => { try { return localStorage.getItem(k); } catch (e) { return "ERR"; } };
const stage = g("rrai-boot-stage"), err = g("rrai-boot-error"), build = g("rrai-build");
document.getElementById("out").innerHTML =
  "مرحلة الإقلاع الأخيرة: <b>" + (stage || "لا يوجد") + "</b><br>" +
  "خطأ الإقلاع المسجل: <b>" + (err || "لا يوجد") + "</b><br>" +
  "الإصدار المحفوظ: <b>" + (build || "لا يوجد") + "</b><br>" +
  "SW مسجلة: <b id=\"swc\">…</b>";
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((r) => {
  document.getElementById("swc").textContent = r.length + " → " + r.map((x) => x.active ? x.active.scriptURL.split("/").pop() : "no-active").join(", ");
}); else document.getElementById("swc").textContent = "غير مدعوم";
document.getElementById("b1").onclick = () => location.replace("./r2/start.html");
document.getElementById("b2").onclick = () => navigator.serviceWorker.getRegistrations().then((all) => Promise.all(all.map((r) => r.unregister()))).then(() => { document.getElementById("swc").textContent = "أُلغيت كلها — أعد فتح التطبيق"; });
document.getElementById("b3").onclick = () => location.reload();
</script>
</body>
</html>
