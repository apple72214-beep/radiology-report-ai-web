<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radiology report AI — نسخة المتصفح</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <style>
      body { margin:0; background:#0f172a; color:#e2e8f0; font-family:system-ui,"Segoe UI",Tahoma,sans-serif; }
      #splash { min-height:100vh; display:flex; align-items:center; justify-content:center; font-size:1rem; padding:1rem; text-align:center; }
    </style>
  </head>
  <body>
    <div id="splash">Radiology report AI — جارٍ التحميل…</div>
    <script type="module">
      /* Immutable launcher v11.
         Release channel order: raw.githubusercontent (always fresh) ->
         mirror release.json -> localStorage. Then probe version-named UI
         files until one exists. Version-named assets make CDN staleness
         impossible; the raw channel makes the manifest fresh. */
      const MIRROR = "./release.json";
      const RAW = "https://raw.githubusercontent.com/apple72214-beep/radiology-report-ai-web/main/release.json";
      const known = ["v11", "v10", "v9"];
      const cands = [];
      const add = (b) => { if (b && !cands.includes(b)) cands.push(b); };
      for (const src of [RAW, MIRROR]) {
        try {
          const r = await fetch(src + (src.includes("?") ? "&" : "?") + "cb=" + Date.now(), { cache: "no-store" });
          if (r.ok) add((await r.json()).build);
        } catch (e) {}
      }
      add(localStorage.getItem("rrai-build"));
      known.forEach(add);
      let build = null;
      for (const b of cands) {
        try {
          const u = await fetch("./ui." + b + ".html?b=" + b, { cache: "no-store" });
          if (u.ok) { build = b; document.body.innerHTML = await u.text(); break; }
        } catch (e) {}
      }
      if (!build) {
        document.getElementById("splash").textContent = "تعذر تحميل أي إصدار معروف — تحقق من الاتصال ثم أعد الفتح.";
      } else {
        localStorage.setItem("rrai-build", build);
        try {
          const m = await import("./app." + build + ".js");
          m.init();
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js?b=" + build).then(async (reg) => {
              // retire workers of other scopes/versions on this origin
              const all = await navigator.serviceWorker.getRegistrations();
              for (const r of all) if (r !== reg) r.unregister().catch(() => {});
            }).catch(() => {});
          }
        } catch (e) {
          const s = document.getElementById("splash");
          if (s) s.textContent = "تعذر تشغيل الإصدار " + build + " — أعد الفتح.";
        }
      }
    </script>
  </body>
</html>
