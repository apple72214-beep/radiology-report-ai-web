<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radiology report AI — نسخة المتصفح</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <style>
      body { margin:0; background:#0f172a; color:#e2e8f0; font-family:system-ui,"Segoe UI",Tahoma,sans-serif; }
      #splash { min-height:100vh; display:flex; align-items:center; justify-content:center; font-size:1rem; }
    </style>
  </head>
  <body>
    <div id="splash">Radiology report AI — جارٍ التحميل…</div>
    <script type="module">
      /* Immutable launcher: reads release.json (cache-busted), loads the
         version-named UI + app, and registers the version-keyed worker.
         No CDN edge can ever serve mismatched releases again. */
      let build = localStorage.getItem("rrai-build") || "v9";
      try {
        const r = await fetch("./release.json?cb=" + Date.now(), { cache: "no-store" });
        if (r.ok) {
          const j = await r.json();
          if (j && j.build) build = j.build;
        }
      } catch (e) { /* offline: keep last known build */ }
      localStorage.setItem("rrai-build", build);
      try {
        const u = await fetch("./ui." + build + ".html?b=" + build, { cache: "no-store" });
        if (!u.ok) throw new Error("ui " + u.status);
        document.body.innerHTML = await u.text();
        const m = await import("./app." + build + ".js");
        m.init();
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("./sw.js?b=" + build).catch(() => {});
        }
      } catch (e) {
        const s = document.getElementById("splash");
        if (s) s.textContent = "تعذر تحميل الواجهة (" + build + ") — تحقق من الاتصال ثم أعد الفتح.";
      }
    </script>
  </body>
</html>
