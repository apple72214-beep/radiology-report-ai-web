<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radiology report AI — نسخة المتصفح</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <style>
      body { margin:0; background:#0f172a; color:#e2e8f0; font-family:system-ui,"Segoe UI",Tahoma,sans-serif; }
      #splash { min-height:100vh; display:flex; align-items:center; justify-content:center; font-size:1rem; padding:1rem; text-align:center; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div id="splash">Radiology report AI — جارٍ التحميل…</div>
    <script type="module">
      /* Resilient bootstrap v2: validates payload size, retries with backoff,
         rotates origins, races imports against timeouts. Blockade-proxy proof. */
      const RAW = "https://raw.githubusercontent.com/apple72214-beep/radiology-report-ai-web/main/release.json";
      const JSR = "https://cdn.jsdelivr.net/gh/apple72214-beep/radiology-report-ai-web@main/release.json";
      const MIRROR = "./release.json";
      const ORIGINS = [
        "./",
        "https://cdn.jsdelivr.net/gh/apple72214-beep/radiology-report-ai-web@main/",
        "https://rawcdn.githack.com/apple72214-beep/radiology-report-ai-web/main/",
        "https://raw.githack.com/apple72214-beep/radiology-report-ai-web/main/"
      ];
      const known = ["v35", "v34", "v33", "v11"];
      const splash = document.getElementById("splash");
      const say = (t) => { splash.textContent = t; };
      const cands = [];
      const add = (b) => { if (b && !cands.includes(b)) cands.push(b); };
      const grab = async (src) => {
        const ctl = new AbortController();
        const t = setTimeout(() => ctl.abort(), 4000);
        try {
          const r = await fetch(src + (src.includes("?") ? "&" : "?") + "cb=" + Date.now(), { cache: "no-store", signal: ctl.signal });
          if (!r.ok) return null;
          const j = await r.json();
          return j && j.build;
        } catch (e) { return null; } finally { clearTimeout(t); }
      };
      const fetchText = async (u, minLen, ms) => {
        const ctl = new AbortController();
        const t = setTimeout(() => ctl.abort(), ms || 9000);
        try {
          const r = await fetch(u + (u.includes("?") ? "&" : "?") + "cb=" + Date.now(), { cache: "no-store", signal: ctl.signal });
          if (!r.ok) throw new Error("http " + r.status);
          const txt = await r.text();
          if (!txt || txt.length < (minLen || 400)) throw new Error("empty-body " + (txt ? txt.length : 0));
          return txt;
        } finally { clearTimeout(t); }
      };
      const importRace = (u, ms) => {
        let to;
        return Promise.race([
          import(u),
          new Promise((_, rej) => { to = setTimeout(() => rej(new Error("import-timeout")), ms || 12000); }),
        ]).finally(() => clearTimeout(to));
      };
      (async () => {
        for (const src of [MIRROR, JSR, RAW]) add(await grab(src));
        add(localStorage.getItem("rrai-build"));
        known.forEach(add);
        let done = false;
        for (const b of cands) {
          let uiText = null, origin = null;
          for (const o of ORIGINS) {
            for (let attempt = 0; attempt < 2 && !uiText; attempt++) {
              try {
                uiText = await fetchText(o + "ui." + b + ".html?b=" + b, 800);
                origin = o;
              } catch (e) {
                say("Radiology report AI — جارٍ التحميل…\n(محاولة " + (attempt + 1) + " للواجهة من " + (o === "./" ? "الخادم الأساسي" : "مرآة") + ")");
                await new Promise((r) => setTimeout(r, 600));
              }
            }
            if (uiText) break;
          }
          if (!uiText) continue;
          document.body.innerHTML = uiText;
          const sp = document.getElementById("splash");
          const say2 = (t) => { if (sp) sp.textContent = t; else say(t); };
          const urls = ORIGINS.map((o) => o + "app." + b + ".js");
          if (origin !== "./") urls.unshift(origin + "app." + b + ".js");
          let mod = null, lastErr = null;
          for (let attempt = 0; attempt < 3 && !mod; attempt++) {
            for (const u of urls) {
              try {
                say2("Radiology report AI — تحميل الوحدة… محاولة " + (attempt + 1));
                mod = await importRace(u, 12000);
                if (mod && mod.init) { origin = u.startsWith("http") ? u.slice(0, u.indexOf("app.")) : "./"; break; }
                mod = null;
              } catch (e) { lastErr = e; }
            }
            if (!mod) await new Promise((r) => setTimeout(r, 800));
          }
          if (!mod) {
            say2("تعذر تشغيل الإصدار " + b + " بعد 3 محاولات: " + (lastErr && lastErr.message ? lastErr.message : lastErr) + "\nأعد الفتح — المحاولات تدور على أربع مرايا تلقائيًا.");
            done = true;
            break;
          }
          localStorage.setItem("rrai-build", b);
          try {
            await mod.init();
          } catch (e) {
            say2("تعذر بدء الإصدار " + b + ": " + (e && e.message ? e.message : e));
          }
          if (origin === "./" && "serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw." + b + ".js?b=" + b).then(async (reg) => {
              const all = await navigator.serviceWorker.getRegistrations();
              for (const r of all) if (r !== reg) r.unregister().catch(() => {});
            }).catch(() => {});
          }
          done = true;
          break;
        }
        if (!done) say("تعذر تحميل أي إصدار معروف — تحقق من الاتصال ثم أعد الفتح.");
      })();
    </script>
  </body>
</html>
