<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radiology report AI — نسخة المتصفح</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <style>
      body { margin:0; background:#0f172a; color:#e2e8f0; font-family:system-ui,"Segoe UI",Tahoma,sans-serif; }
      #splash { min-height:100vh; display:flex; align-items:center; justify-content:center; font-size:1rem; padding:1rem; text-align:center; white-space:pre-wrap; }
    </style>
  </head>
  <body>
    <div id="splash">Radiology report AI — جارٍ التحميل…</div>
    <script type="module">
      /* Resilient bootstrap v2.3: poisoned-proxy-cache proof.
         - exact char+byte length validation (truncation detected)
         - fresh hostnames the intermediary has never cached (project alias)
         - external wrapper origin (allorigins)
         - Range-chunked reassembly (4 KiB slices under the truncation threshold)
         - blob module assembly: import() never touches the network
         - live log line: stage + host + attempt + seconds + last error */
      const MARK = "ب2.82";
      const EXPECT = {"v110": {"consult": [5239, 5341, "729d62402ecb1ccc2959c7f55fc55f5141c5f088f4881bf8aa378bc565daf8ec"], "decode": [5236, 5236, "f2b87411b1e3c14edc6b0815a16cb775dffccdffa078d946968db818e1f9abd2"], "dicom": [10471, 10473, "b68acbc3136d7fdfe718034109f1b16f170f8260bfd5305b254d2e4c7508b609"], "triage": [5206, 5542, "a434a45f28ede36f9018e983fb3c8f3a599df0674d0e94528843fd7db2b83a47"], "docx": [20206, 20498, "579b8903eff3d2255462d958a7309affa4d2add3d1d694e3c27e8279068654a9"], "measure": [1650, 1652, "39044eae7274081becae2478481b4eace4ed9d8bfa5063e0d9c9513c33bd667f"], "compare": [1442, 1444, "a4308f873614e66ca3c21378554778d11afbbb9ebd9f2e8e41bf7b3cefe23c0b"], "report": [8574, 9460, "0e46cb9e36837d05d069de060d94c7fefb3001a07bee532fe29bde05c01e091e"], "mpr": [8050, 8058, "db1435dc932c083ac6f4c3a86ce51bf61cfbf265b331fee234931942c204fc83"], "app": [217901, 228523, "8419a8e14589ed009b63f636720d1031aa7f552cb9e37a87420fe05950d2c763"], "ui": [41849, 45163, "23f8dfab0651b65d2241cbf52733e8ffab1bd8ca3b1c20b2aee0903a77fcd1c9"]}};
      const TOPO = ["consult","decode","dicom","triage","docx","measure","compare","report","mpr","app"];
      const RAW = "https://raw.githubusercontent.com/apple72214-beep/radiology-report-ai-web/main/release.json";
      const JSR = "https://cdn.jsdelivr.net/gh/apple72214-beep/radiology-report-ai-web@main/release.json";
      const MIRROR = "./release.json";
      const ALIAS = "https://raw.githubusercontent.com/apple72214-beep/radiology-report-ai-web/main/";
      const PIN = "https://cdn.jsdelivr.net/gh/apple72214-beep/radiology-report-ai-web@8a62a621d47265b69c826c3fb212926910cd5b30/";
      const ORIGINS = ["./", ALIAS,
        "https://rawcdn.githack.com/apple72214-beep/radiology-report-ai-web/main/",
        "https://raw.githack.com/apple72214-beep/radiology-report-ai-web/main/",
        "https://cdn.jsdelivr.net/gh/apple72214-beep/radiology-report-ai-web@main/",
        PIN];
      const WRAP = (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u);
      const PREFIXES = ["", "r1/", "r2/", "r3/"];
      const known = ["v110", "v109", "v108", "v107", "v106", "v105", "v104", "v103", "v102", "v101", "v100", "v99", "v98", "v97", "v96", "v95", "v94", "v93", "v92", "v91", "v90", "v89", "v88", "v87", "v86", "v85", "v84", "v83", "v82", "v81", "v80", "v79", "v78", "v77", "v76", "v75", "v74", "v73", "v72", "v71", "v70", "v69", "v68", "v67", "v66", "v65", "v64", "v63", "v62", "v61", "v60", "v59", "v58", "v57", "v56", "v55", "v54", "v53", "v52", "v51", "v50", "v49", "v48", "v47", "v46", "v45", "v44", "v43", "v42", "v41", "v40", "v39", "v38", "v37", "v36", "v35"];;
      const splash = document.getElementById("splash");
      let logLine = MARK + " — بدء…", lastErr = null;
      const t0 = Date.now();
      setInterval(() => {
        const el = document.getElementById("splash") || splash;
        el.textContent = logLine + " — " + Math.round((Date.now() - t0) / 1000) + "ث" + (lastErr ? "\nآخر خطأ: " + (lastErr.message || lastErr) : "");
      }, 1000);
      const say = (t) => { logLine = MARK + " — " + t; };
      /* A response that fails length/sha validation while an old service worker is in
         control is almost always that worker serving a stale body. Evict it once per
         session and reload, so the next boot talks to the network directly. */
      const nukeStaleWorker = async () => {
        let done = false;
        try { done = sessionStorage.getItem("rrai-swnuke") === "1"; } catch (e) {}
        if (done) return false;
        try { sessionStorage.setItem("rrai-swnuke", "1"); } catch (e) {}
        try {
          if (navigator.serviceWorker) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const r of regs) { try { await r.unregister(); } catch (e2) {} }
          }
        } catch (e) {}
        try { const ks = await caches.keys(); for (const k of ks) { await caches.delete(k); } } catch (e) {}
        return true;
      };
      const healing = async () => {
        if (!(navigator.serviceWorker && navigator.serviceWorker.controller)) return false;
        const ok = await nukeStaleWorker();
        if (ok) { say("عامل خدمة قديم يعترض التحديث — إعادة التشغيل من الشبكة…"); setTimeout(() => location.reload(), 400); }
        return ok;
      };
      const failPanel = (msg) => {
        const el = document.getElementById("splash") || splash;
        el.innerHTML = msg +
          '<br><button id="rrai-retry" style="margin:.8rem .3rem 0;padding:.6rem 1.4rem;font-size:1rem;border:0;border-radius:.5rem;background:#e2e8f0;color:#0f172a;font-family:inherit">إعادة المحاولة الآن</button>' +
          '<button id="rrai-solo" style="margin:.8rem .3rem 0;padding:.6rem 1.4rem;font-size:1rem;border:0;border-radius:.5rem;background:#38bdf8;color:#0f172a;font-family:inherit">افتح نسخة الملف الواحد (بلا أي مصدر خارجي)</button>' +
          '<br><span style="font-size:.8rem;opacity:.85;display:block;margin-top:.6rem">إن تكرّر الفشل فشبكتك تحجب المصادر الخارجية — افتح <a href="./diag.html" style="color:#7dd3fc">صفحة التشخيص</a> لمعرفة المحجوب بالضبط.</span>';
        const btn = document.getElementById("rrai-retry");
        if (btn) btn.onclick = () => location.reload();
        const solo = document.getElementById("rrai-solo");
        if (solo) solo.onclick = () => location.replace("./standalone.html?f=1");
        try {
          if (!sessionStorage.getItem("rrai-solo-try")) {
            sessionStorage.setItem("rrai-solo-try", "1");
            setTimeout(() => location.replace("./standalone.html?f=1"), 2500);
          }
        } catch (e) {}
      };
      const hostOf = (o) => (o === "./" ? "الخادم الأساسي" : o.replace("https://", "").split("/")[0]);
      const grab = async (src) => {
        const ctl = new AbortController();
        const t = setTimeout(() => ctl.abort(), 2500);
        try {
          const r = await fetch(src + (src.includes("?") ? "&" : "?") + "cb=" + Date.now(), { cache: "no-store", signal: ctl.signal });
          if (!r.ok) return null;
          const j = await r.json();
          return j && j.build;
        } catch (e) { return null; } finally { clearTimeout(t); }
      };
      const fetchBuf = async (u, ms, headers) => {
        const ctl = new AbortController();
        const t = setTimeout(() => ctl.abort(), ms || 15000);
        try {
          const r = await fetch(u, { cache: "no-store", signal: ctl.signal, headers: headers || {} });
          if (!r.ok && r.status !== 206) throw new Error("http " + r.status);
          return await r.arrayBuffer();
        } catch (e) {
          try { const hit = await caches.match(u, { ignoreSearch: true }); if (hit) return await hit.arrayBuffer(); } catch (e2) {}
          throw e;
        } finally { clearTimeout(t); }
      };
      let rangeBroken = false; /* some proxies answer a Range request with the whole file */
      const rangedFetch = async (u, byteLen, label) => {
        if (rangeBroken) throw new Error("range-unsupported");
        const CH = 4096;
        const parts = [];
        let pos = 0;
        while (pos < byteLen) {
          const end = Math.min(pos + CH - 1, byteLen - 1);
          say(label + " — شريحة " + (pos / CH + 1) + "/" + Math.ceil(byteLen / CH));
          const buf = await fetchBuf(u + (u.includes("?") ? "&" : "?") + "rg=" + pos, 12000, { Range: "bytes=" + pos + "-" + end });
          if (!buf || buf.byteLength === 0) throw new Error("empty-chunk@" + pos);
          if (buf.byteLength === byteLen && pos === 0) return buf; /* proxy ignored Range, full body ok */
          if (buf.byteLength !== end - pos + 1) throw new Error("chunk-len " + buf.byteLength + "@" + pos);
          parts.push(buf);
          pos = end + 1;
        }
        let total = 0;
        parts.forEach((p) => (total += p.byteLength));
        const out = new Uint8Array(total);
        let off = 0;
        parts.forEach((p) => { out.set(new Uint8Array(p), off); off += p.byteLength; });
        return out.buffer;
      };
      const sha256hex = async (buf) => {
        const d = await crypto.subtle.digest("SHA-256", buf);
        return Array.from(new Uint8Array(d)).map((x) => x.toString(16).padStart(2, "0")).join("");
      };
      const checkSha = async (buf, exp) => {
        if (exp && exp[2]) {
          const h = await sha256hex(buf);
          if (h !== exp[2]) throw new Error("sha " + h.slice(0, 8) + "≠" + exp[2].slice(0, 8));
        }
      };
      const getValidated = async (path, exp, label) => {
        const expChars = exp ? exp[0] : 0, expBytes = exp ? exp[1] : 0;
        let err = null;
        for (let attempt = 0; attempt < 2; attempt++) {
          for (const px of PREFIXES) {
          for (let i = 0; i < ORIGINS.length; i++) {
            const o = ORIGINS[(i + attempt) % ORIGINS.length];
            if (px && o !== "./") continue; /* r1/r2/r3 prefixes exist only on our Vercel host */
            const base = o + px + path + "?b=" + Date.now() + "-" + i;
            say(label + " من " + hostOf(o) + (px ? "/" + px.slice(0, 2) : "") + " (محاولة " + (attempt + 1) + ")");
            try {
              const buf = await fetchBuf(base);
              const txt = new TextDecoder().decode(buf);
              if (!txt || txt.length < 400) throw new Error("empty-body " + (txt ? txt.length : 0));
              if (expChars && txt.length !== expChars) {
                const errLen = new Error("len " + txt.length + "≠" + expChars);
                errLen.__bad = true;
                throw errLen;
              }
              await checkSha(buf, exp);
              return txt;
            } catch (e) {
              err = e; lastErr = e;
              if (e && e.__bad) { const healed = await healing(); if (healed) { err = new Error("healing"); throw err; } }
              try {
                const ck = await caches.open("rrai-boot");
                const keys = await ck.keys();
                for (const rq of keys) if (rq.url.split("?")[0].endsWith(path)) await ck.delete(rq);
              } catch (e3) {}
              if (expBytes) {
                try {
                  say(label + " — إعادة تجميع شرائح من " + hostOf(o) + (px ? "/" + px.slice(0, 2) : ""));
                  const buf = await rangedFetch(o + px + path, expBytes, label);
                  const txt = new TextDecoder().decode(buf);
                  if (expChars && txt.length !== expChars) throw new Error("ranged-len " + txt.length + "≠" + expChars);
                  await checkSha(buf, exp);
                  return txt;
                } catch (e2) { err = e2; lastErr = e2; }
              }
            }
          }
          }
          try {
            say(label + " عبر غلاف خارجي (محاولة " + (attempt + 1) + ")");
            const buf = await fetchBuf(WRAP(ALIAS + path), 20000);
            const txt = new TextDecoder().decode(buf);
            if (expChars && txt.length !== expChars) throw new Error("wrap-len " + txt.length + "≠" + expChars);
            await checkSha(buf, exp);
            return txt;
          } catch (e) { err = e; lastErr = e; }
        }
        throw err || new Error("fetch failed: " + path);
      };
      (async () => {
        const builds = await Promise.all([grab(MIRROR), grab(JSR), grab(RAW)]);
        const cands = [];
        const add = (b) => { if (b && !cands.includes(b)) cands.push(b); };
        builds.forEach(add);
        add(localStorage.getItem("rrai-build"));
        known.forEach(add);
        const verL = (v) => parseInt(String(v).replace(/\D/g, ""), 10) || 0;
        cands.sort((x, y) => verL(y) - verL(x));
        let newerFailed = "";
        let done = false;
        for (const b of cands) {
          if (!EXPECT[b]) {
            try {
              const ir = await fetch("./integrity." + b + ".json?cb=" + Date.now(), { cache: "no-store" });
              const ij = ir.ok ? await ir.json() : null;
              if (ij && ij.files) { EXPECT[b] = {}; for (const k in ij.files) EXPECT[b][k] = [ij.files[k].chars, ij.files[k].bytes, ij.files[k].sha256]; }
            } catch (e) {}
          }
          let uiText = null;
          try {
            uiText = await getValidated("ui." + b + ".html", (EXPECT[b] || {}).ui, "الواجهة");
          } catch (e) { continue; }
          document.body.innerHTML = uiText;
          const texts = {};
          let ok = true;
          for (const n of TOPO) {
            const p = n === "decode" ? "codecs/decode." + b + ".js" : n + "." + b + ".js";
            const exp = (EXPECT[b] || {})[n] || 0;
            try {
              texts[n] = await getValidated(p, exp, "وحدة " + n);
            } catch (e) { ok = false; break; }
          }
          if (!ok) continue;
          say("تركيب الوحدات داخليًا…");
          const blobUrls = {};
          try {
            for (const n of TOPO) {
              let txt = texts[n];
              for (const d of TOPO) {
                if (d === n || !blobUrls[d]) continue;
                const rx = d === "decode"
                  ? /(["'])\.\/codecs\/decode\.v\d+\.js\1/g
                                    : new RegExp("([\"'])\\.\\/" + d + "\\.v\\d+\\.js\\1", "g");
                txt = txt.replace(rx, '"' + blobUrls[d] + '"');
              }
              const leftover = txt.match(/from\s*["']\.\//) || txt.match(/import\(\s*["']\.\//);
              if (leftover) throw new Error("unresolved-relative:" + n);
              blobUrls[n] = URL.createObjectURL(new Blob([txt], { type: "text/javascript" }));
            }
            const mod = await import(blobUrls.app);
            say("بدء التطبيق…");
            localStorage.setItem("rrai-build", b);
            await Promise.race([
              mod.init(),
              new Promise((_, rej) => setTimeout(() => rej(new Error("init-timeout")), 90000))
            ]);
            const spd = document.getElementById("splash");
            if (spd) spd.remove();
            if ("serviceWorker" in navigator) {
            window.addEventListener("pageshow", (ev) => { if (ev.persisted) { try { if (!sessionStorage.getItem("rrai-bfc-reload")) { sessionStorage.setItem("rrai-bfc-reload", "1"); location.reload(); } } catch (e3) {} } });
            if (navigator.serviceWorker) navigator.serviceWorker.addEventListener("message", (ev) => { if (ev.data === "rrai-sw-updated") { try { if (!sessionStorage.getItem("rrai-sw-reload")) { sessionStorage.setItem("rrai-sw-reload", "1"); location.reload(); } } catch (e3) {} } });
              const swReg = (u, sc) => navigator.serviceWorker.register(u, { scope: sc || "./", updateViaCache: "none" });
              swReg("./sw." + b + ".js?b=" + b).then(async (reg) => {
                if (!reg) return;
                const all = await navigator.serviceWorker.getRegistrations();
                for (const r of all) if (r !== reg) r.unregister().catch(() => {});
              }).catch(() => {});
            }
            done = true;
            if (newerFailed && verL(newerFailed) > verL(b)) {
              /* we booted an older build because the newest one could not be verified here:
                 hand over to the single-file edition, which needs no ranged fetching. */
              say("تعذّر تحميل " + newerFailed + " — فتح نسخة الملف الواحد…");
              try {
                if (!sessionStorage.getItem("rrai-newer-fail")) {
                  sessionStorage.setItem("rrai-newer-fail", "1");
                  setTimeout(() => location.replace("./standalone.html?f=1"), 1200);
                }
              } catch (e) {}
            }
            break;
          } catch (e) {
            lastErr = e;
            if (!newerFailed || verL(b) > verL(newerFailed)) newerFailed = b;
            const st = localStorage.getItem("rrai-boot-stage") || "غير معروف";
            say("توقف الإصدار " + b + " عند مرحلة: " + st);
          }
        }
        if (!done) failPanel(MARK + " — تعذر تحميل أي إصدار سليم بعد دوران كامل على المرايا والشرائح." + (lastErr ? "<br>آخر خطأ: " + (lastErr.message || lastErr) : ""));
      })();
    </script>
  </body>
</html>
