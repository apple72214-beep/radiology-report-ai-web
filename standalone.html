ta.bodyPart || meta.studyDesc || \"\"].filter(Boolean).join(\" of \").replace(\"of \", (x) => (meta.bodyPart ? \" of \" : \" \"));\n  const en = String(draft.en || \"\");\n  const impLine = en.split(\"\\n\").find((l) => l.startsWith(\"Impression:\")) || \"\";\n  const triageLine = en.split(\"\\n\").find((l) => l.startsWith(\"Automated triage score:\")) || \"\";\n  const L = [];\n  L.push(para(\"MEDICAL RADIOLOGY REPORT\", { bold: true, sz: 30, color: NAVY, ltr: true, align: \"center\", after: 240 }));\n  L.push(para(\"Patient Name: \" + (meta.patientName || study.patient || \"—\"), { ltr: true, after: 40 }));\n  L.push(para(\"Sex: \" + (meta.sex || \"—\") + \"     Age: \" + (meta.age || \"—\"), { ltr: true, after: 40 }));\n  L.push(para(\"Exam Date: \" + fmtDate(meta.studyDate), { ltr: true, after: 40 }));\n  L.push(paraBold(\"Exam: \" + (compExam || (meta.bodyPart || meta.studyDesc ? modality + \" of the \" + (meta.bodyPart || meta.studyDesc) : modality + \" study\")), { ltr: true, after: 40 }));\n  L.push(paraBold(\"Clinical Indication: \" + (compInd || study.indication || study.triage?.context || \"—\") + \".\", { ltr: true, after: 200 }));\n  L.push(para(\"TECHNIQUE:\", { bold: true, color: BLUE, ltr: true, after: 60 }));\n  const compTech = comp && comp.technique ? String(comp.technique).trim() : \"\";\n  L.push(paraBold(compTech || techniqueFor(study), { ltr: true, after: 200 }));\n  L.push(para(\"FINDINGS:\", { bold: true, color: BLUE, ltr: true, after: 60 }));\n  if (compF && compF.length) {\n    for (const l of compF.filter((x, i) => x !== compF[i - 1])) L.push(paraBold(l, { ltr: true, after: 60 }));\n  } else {\n    for (const l of en.split(\"\\n\")) {\n      if (l.startsWith(\"Impression:\") || l.startsWith(\"Automated triage\") || l.startsWith(\"Radiology report draft\") || l.startsWith(\"Patient:\") || l.startsWith(\"Recommendation:\") || l.startsWith(\"Sign-off:\")) continue;\n      if (l.trim()) L.push(para(l, { ltr: true, after: 60 }));\n    }\n    if (impLine) L.push(para(impLine.replace(\"Impression: \", \"\"), { ltr: true, after: 60 }));\n  }\n  for (const s of (study.measurements?.segments || [])) L.push(para(\"Measurement: segment \" + (s.mm != null ? s.mm.toFixed(1) + \" mm\" : s.px.toFixed(0) + \" px\") + \".\", { ltr: true, after: 40 }));\n  for (const g of (study.measurements?.angles || [])) L.push(para(\"Measurement: angle \" + g.deg.toFixed(1) + \" degrees.\", { ltr: true, after: 40 }));\n  for (const r of (study.measurements?.rois || [])) L.push(para(\"Measurement: ROI mean \" + r.mean.toFixed(1) + \" \" + r.unit + \" (SD \" + r.std.toFixed(1) + \", n=\" + r.n + \").\", { ltr: true, after: 40 }));\n  if (study.compare) L.push(para(\"Comparison with prior study \" + (study.compare.patient || study.compare.uid) + \": mean absolute difference \" + Number(study.compare.meanAbs).toFixed(3) + \", hot spots \" + Number(study.compare.pctHot).toFixed(1) + \"% (threshold 0.25 after normalization).\", { ltr: true, after: 200 }));\n  L.push(para(\"IMPRESSION:\", { bold: true, color: BLUE, ltr: true, after: 60 }));\n  const bullets = [];\n  if (compI && compI.length) { for (const l of compI.filter((x, i) => x !== compI[i - 1])) bullets.push(l); }\n  else {\n  if (impLine) bullets.push(impLine.replace(\"Impression: \", \"\").split(\". Triage priority\")[0] + \".\");\n  if (triageLine) bullets.push(triageLine);\n  }\n  if (study.compare) bullets.push(\"Comparison performed with \" + (study.compare.patient || study.compare.uid) + \" as recorded above.\");\n  bullets.push(\"Recommendation: radiologist review and sign-off required — this draft is not a diagnosis.\");\n  for (let bi2 = 0; bi2 < bullets.length; bi2++) L.push(paraBold(\"• \" + String(bullets[bi2]).replace(/^[\\s\\u2022\\u00b7\\-\\u2013]+/, \"\"), { ltr: true, shd: BOX, ind: 227, after: bi2 === bullets.length - 1 ? 200 : 0 }));\n  L.push(para(\"\", { ltr: true, after: 300 }));\n  L.push(para(\"Reported by:\", { ltr: true, align: \"right\", after: 20 }));\n  L.push(para(m.signer || \"—\", { bold: true, ltr: true, align: \"right\", after: 20 }));\n  L.push(para((m.license ? \"License: \" + m.license + \" — \" : \"\") + \"Consultant Radiologist\", { ltr: true, align: \"right\", color: \"595959\", sz: 20, after: 120 }));\n  L.push(para(\"Document SHA-256: \" + m.hash, { ltr: true, sz: 16, color: \"808080\", after: 20 }));\n  L.push(para(\"Signed at: \" + m.at + \" — Decision-support output; final clinical responsibility rests with the signing physician.\", { ltr: true, sz: 16, color: \"808080\" }));\n  return `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<w:document xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\"><w:body>${L.join(\"\")}<w:sectPr><w:pgSz w:w=\"11906\" w:h=\"16838\"/><w:marG w:top=\"1134\" w:bottom=\"1134\" w:left=\"1134\" w:right=\"1134\"/><\/w:sectPr><\/w:body><\/w:document>`;\n}\nexport function buildDocxReportEn(study, draft, m, comp) {\n  const enc = new TextEncoder();\n  const ct = `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\"><Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/><Default Extension=\"xml\" ContentType=\"application/xml\"/><Override PartName=\"/word/document.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml\"/><Override PartName=\"/word/styles.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml\"/><\/Types>`;\n  const rl = `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\"><Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"word/document.xml\"/><Relationship Id=\"rId2\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relatio (para(`سجل: ${l.action} بواسطة ${l.actor} @ ${l.at}`, { sz: 18 }));\n  lines.push(para(\"التوقيع الإلكتروني السريري\", { bold: true, sz: 26 }));\n  lines.push(para(`الاسم: ${m.signer}${m.license ? \"   الترخيص: \" + m.license : \"\"}`));\n  lines.push(para(\"أقرّ بصفتي الطبيب المسؤول بمراجعة الصور واعتماد هذا التقرير.\"));\n  lines.push(para(\"Document SHA-256: \" + m.hash, { ltr: true, sz: 18 }));\n  lines.push(para(\"Decision-support output; final clinical responsibility rests with the signing physician.\", { ltr: true, sz: 18 }));\n  return `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<w:document xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\"><w:body>${lines.join(\"\")}<w:sectPr><w:pgSz w:w=\"11906\" w:h=\"16838\"/><w:marG w:top=\"1134\" w:bottom=\"1134\" w:left=\"1134\" w:right=\"1134\"/><\/w:sectPr><\/w:body><\/w:document>`;\n}\n\nexport function buildDocxReport(study, draft, m) {\n  const enc = new TextEncoder();\n  const contentTypes = `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\"><Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/><Default Extension=\"xml\" ContentType=\"application/xml\"/><Override PartName=\"/word/document.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml\"/><Override PartName=\"/word/styles.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml\"/><Override PartName=\"/docProps/core.xml\" ContentType=\"application/vnd.openxmlformats-package.core-properties+xml\"/><Override PartName=\"/docProps/app.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.extended-properties+xml\"/><\/Types>`;\n  const rels = `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\"><Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"word/document.xml\"/><Relationship Id=\"rId2\" Type=\"http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties\" Target=\"docProps/core.xml\"/><Relationship Id=\"rId3\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties\" Target=\"docProps/app.xml\"/><\/Relationships>`;\n  const docRels = `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\"><Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles\" Target=\"styles.xml\"/><\/Relationships>`;\n  const styles = `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<w:styles xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii=\"Calibri\" w:hAnsi=\"Calibri\" w:cs=\"Segoe UI\"/><w:sz w:val=\"22\"/><\/w:rPr><\/w:rPrDefault><\/w:docDefaults><w:style w:type=\"paragraph\" w:default=\"1\" w:styleId=\"Normal\"><w:name w:val=\"Normal\"/><\/w:style><\/w:styles>`;\n  const core = `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<cp:coreProperties xmlns:cp=\"http://schemas.openxmlformats.org/package/2006/metadata/core-properties\" xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:dcterms=\"http://purl.org/dc/terms/\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"><dc:title>${esc(\"تقرير تصوير شعاعي موقّع — \" + study.patient)}<\/dc:title><dc:creator>${esc(m.signer || \"\")}<\/dc:creator><cp:lastModifiedBy>${esc(m.signer || \"\")}<\/cp:lastModifiedBy><dcterms:created xsi:type=\"dcterms:W3CDTF\">${esc(m.at || \"\")}<\/dcterms:created><\/cp:coreProperties>`;\n  const app = `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<Properties xmlns=\"http://schemas.openxmlformats.org/officeDocument/2006/extended-properties\"><Application>Radiology report AI<\/Application><AppVersion>1.0<\/AppVersion><\/Properties>`;\n  return zipStore([\n    { name: \"[Content_Types].xml\", data: enc.encode(contentTypes) },\n    { name: \"_rels/.rels\", data: enc.encode(rels) },\n    { name: \"word/document.xml\", data: enc.encode(documentXml(study, draft, m)) },\n    { name: \"word/styles.xml\", data: enc.encode(styles) },\n    { name: \"word/_rels/document.xml.rels\", data: enc.encode(docRels) },\n    { name: \"docProps/core.xml\", data: enc.encode(core) },\n    { name: \"docProps/app.xml\", data: enc.encode(app) },\n  ]);\n}\n", "measure": "/* Measurement math — pure, testable. v1.0.3 suite: segments / angles / ROI stats. */\nexport function dist(a, b) { return Math.hypot(b[0] - a[0], b[1] - a[1]); }\nexport function segMm(a, b, spacing) {\n  if (!spacing) return null;\n  const dy = (b[1] - a[1]) * (spacing[0] || spacing[1]);\n  const dx = (b[0] - a[0]) * (spacing[1] || spacing[0]);\n  return Math.hypot(dx, dy);\n}\nexport function angleDeg(p1, v, p2) {\n  const a1 = Math.atan2(p1[1] - v[1], p1[0] - v[0]);\n  const a2 = Math.atan2(p2[1] - v[1], p2[0] - v[0]);\n  let d = Math.abs(a1 - a2) * 180 / Math.PI;\n  if (d > 180) d = 360 - d;\n  return d;\n}\nexport function grayAt(frame, x, y) {\n  const i = (y | 0) * frame.w + (x | 0);\n  if (frame.kind === \"rgb\") {\n    const d = frame.data;\n    return 0.299 * d[i * 3] + 0.587 * d[i * 3 + 1] + 0.114 * d[i * 3 + 2];\n  }\n  return frame.data[i];\n}\nexport function ellipseStats(frame, c, rx, ry) {\n  let n = 0, sum = 0, sum2 = 0, mn = Infinity, mx = -Infinity;\n  const x0 = Math.max(0, Math.ceil(c[0] - rx)), x1 = Math.min(frame.w - 1, Math.floor(c[0] + rx));\n  const y0 = Math.max(0, Math.ceil(c[1] - ry)), y1 = Math.min(frame.h - 1, Math.floor(c[1] + ry));\n  for (let y = y0; y <= y1; y++) {\n    for (let x = x0; x <= x1; x++) {\n      const dx = (x - c[0]) / rx, dy = (y - c[1]) / ry;\n      if (dx * dx + dy * dy > 1) continue;\n      const v = grayAt(frame, x, y);\n      n++; sum += v; sum2 += v * v;\n      if (v < mn) mn = v;\n      if (v > mx) mx = v;\n    }\n  }\n  if (!n) return null;\n  const mean = sum / n;\n  const std = Math.sqrt(Math.max(0, sum2 / n - mean * mean));\n  return { mean, std, min: mn, max: mx, n, unit: frame.hu ? \"HU\" : \"gray\" };\n}\n", "compare": "/* Prior-study comparison math — pure, testable. v1.1.1 */\nexport function frameStats(data) {\n  let mn = Infinity, mx = -Infinity, sum = 0;\n  for (let i = 0; i < data.length; i++) {\n    const v = data[i];\n    if (v < mn) mn = v;\n    if (v > mx) mx = v;\n    sum += v;\n  }\n  return { min: mn, max: mx, mean: sum / data.length };\n}\nexport function normalize01(data, min, max) {\n  const r = max - min || 1;\n  const out = new Float32Array(data.length);\n  for (let i = 0; i < data.length; i++) out[i] = (data[i] - min) / r;\n  return out;\n}\nexport function diffStats(a, b, thr = 0.25) {\n  const n = Math.min(a.length, b.length);\n  let sum = 0, hot = 0;\n  const mask = new Uint8Array(n);\n  for (let i = 0; i < n; i++) {\n    const d = Math.abs(a[i] - b[i]);\n    sum += d;\n    if (d > thr) { hot++; mask[i] = 1; }\n  }\n  return { meanAbs: sum / n, pctHot: (hot / n) * 100, mask };\n}\nexport function grayOf(frame, x, y) {\n  const i = (y | 0) * frame.w + (x | 0);\n  if (frame.kind === \"rgb\") {\n    const d = frame.data;\n    return 0.299 * d[i * 3] + 0.587 * d[i * 3 + 1] + 0.114 * d[i * 3 + 2];\n  }\n  return frame.data[i];\n}\nexport function frameGrayFlat(frame) {\n  const n = frame.w * frame.h;\n  const out = new Float32Array(n);\n  for (let i = 0; i < n; i++) {\n    if (frame.kind === \"rgb\") {\n      out[i] = 0.299 * frame.data[i * 3] + 0.587 * frame.data[i * 3 + 1] + 0.114 * frame.data[i * 3 + 2];\n    } else out[i] = frame.data[i];\n  }\n  return out;\n}\n", "report": "/* Radiology report AI — bilingual (AR/EN) structured report draft.\n   Decision-support only: every draft states it requires radiologist review. */\n\nfunction meanStd(data) {\n  let s = 0, s2 = 0;\n  const n = data.length;\n  for (let i = 0; i < n; i++) { const v = data[i]; s += v; s2 += v * v; }\n  const m = s / n;\n  return { m, sd: Math.sqrt(Math.max(0, s2 / n - m * m)) };\n}\n\n/* Coarse 2x2 quadrant analysis of the inner field (skip borders). */\nfunction quadrants(pixels) {\n  const { w, h, data } = pixels;\n  const q = [0, 0, 0, 0], cnt = [0, 0, 0, 0];\n  const x0 = Math.floor(w * 0.15), x1 = Math.floor(w * 0.85);\n  const y0 = Math.floor(h * 0.15), y1 = Math.floor(h * 0.85);\n  for (let y = y0; y < y1; y++) {\n    for (let x = x0; x < x1; x++) {\n      const i = (y < (y0 + y1) / 2 ? 0 : 2) + (x < (x0 + x1) / 2 ? 0 : 1);\n      q[i] += data[y * w + x]; cnt[i]++;\n    }\n  }\n  return q.map((v, i) => v / Math.max(1, cnt[i]));\n}\n\nconst QUAD_AR = [\"الأيسر العلوي\", \"الأيمن العلوي\", \"الأيسر السفلي\", \"الأيمن السفلي\"];\nconst QUAD_EN = [\"upper-left\", \"upper-right\", \"lower-left\", \"lower-right\"];\n\nimport { sha256Text } from \"./consult.v35.js\";\n\nexport function draftReport(study) {\n  const px = study.frames[0];\n  const { m, sd } = meanStd(px.data);\n  const qs = quadrants(px);\n  const qMean = qs.reduce((a, b) => a + b, 0) / 4;\n  let bi = 0;\n  for (let i = 1; i < 4; i++) if (qs[i] > qs[bi]) bi = i;\n  const focal = study.triage && study.triage.priority === \"urgent\";\n  const slices = study.frames.length;\n  const modality = study.modality || \"CR\";\n  const patient = study.patient || \"—\";\n\n  const ar = [\n    \"مسودة تقرير أشعة — توليد آلي لدعم القرار فقط\",\n    `المريض: ${patient} | النوع: ${modality} | الشرائح: ${slices}`,\n    focal\n      ? `الانطباع: ظل بؤري عالي الكثافة يرجَّح أنه آفة، يتمركز في الربع ${QUAD_AR[bi]} من الحقل الداخلي (متوسط كثافة الربع ${Math.round(qs[bi])} مقابل ${Math.round(qMean)} لمتوسط الحقول). الأولوية: حرجة.`\n      : `الانطباع: لا يبرز ظل بؤري عالي الكثافة في الحقول الأربعة (أعلى ربع ${Math.round(qs[bi])} مقابل متوسط ${Math.round(qMean)})؛ النمط ضمن الحدود الروتينية. الأولوية: روتينية.`,\n    `مؤشر الفرز الآلي: ${study.triage ? study.triage.score.toFixed(4) : \"—\"} (عتبة الحرج ≥ 0.01).`,\n    `سياق الفرز: ${study.triage?.context || \"unknown\"} — ${(study.triage?.reasons || []).join(\"؛ \")}.`,\n    ...(study.docHash ? [`بصمة آخر توقيع: ${String(study.docHash).slice(0, 16)}…`] : []),\n    ...((study.measurements?.segments || []).map((s, i) => `قياس ${i + 1}: ${s.mm != null ? s.mm.toFixed(1) + \" مم\" : s.px.toFixed(0) + \" بكسل\"}`)),\n    ...((study.measurements?.angles || []).map((g, i) => `زاوية ${i + 1}: ${g.deg.toFixed(1)}°`)),\n    ...((study.measurements?.rois || []).map((ro, i) => `ROI ${i + 1}: متوسط ${ro.mean.toFixed(1)} ${ro.unit} (σ ${ro.std.toFixed(1)}، n=${ro.n})`)),\n    ...(study.consult ? [`استشارة واردة من ${study.consult.from}: ${study.consult.note || \"—\"}`] : []),\n    ...(study.compare ? [`مقارنة مع ${study.compare.patient || study.compare.uid}: متوسط فرق ${Number(study.compare.meanAbs).toFixed(3)} ونقاط ساخنة ${Number(study.compare.pctHot).toFixed(1)}%.`] : []),\n    ...(study.consultReply ? [`رد المستشار ${study.consultReply.actor}: ${study.consultReply.note || \"—\"}`] : []),\n    ...((study.consultLog || []).map((l) => `سجل: ${l.action} بواسطة ${l.actor} @ ${l.at}`)),\n    study.signedBy ? `الاعتماد: مسجلة بتوقيع ${study.signedBy}.` : \"\",\n    \"التوصية: مراجعة أخصائي الأشعة واعتماد التقرير النهائي — هذه المسودة ليست تشخيصًا.\",\n  ].filter(Boolean).join(\"\\n\");\n\n  const en = [\n    \"Radiology report draft — AI-generated, decision support only\",\n    `Patient: ${patient} | Modality: ${modality} | Slices: ${slices}`,\n    focal\n      ? `Impression: focal high-density opacity suggestive of a lesion, centered in the ${QUAD_EN[bi]} quadrant of the inner field (quadrant mean ${Math.round(qs[bi])} vs field mean ${Math.round(qMean)}). Triage priority: urgent.`\n      : `Impression: no dominant focal high-density opacity across the four quadrants (max quadrant ${Math.round(qs[bi])} vs mean ${Math.round(qMean)}); pattern within routine limits. Triage priority: routine.`,\n    `Automated triage score: ${study.triage ? study.triage.score.toFixed(4) : \"—\"} (urgent threshold >= 0.01).`,\n    `Triage context: ${study.triage?.context || \"unknown\"} — ${(study.triage?.reasons || []).join(\"; \")}.`,\n    study.signedBy ? `Sign-off: recorded under ${study.signedBy}.` : \"\",\n    \"Recommendation: radiologist review and sign-off required — this draft is not a diagnosis.\",\n  ].filter(Boolean).join(\"\\n\");\n\n  return { ar, en };\n}\n\n\nexport async function signedDocHash(study, draft, o) {\n  const canon = JSON.stringify({\n    uid: study.uid, patient: study.patient, modality: study.modality,\n    ar: draft.ar, en: draft.en, signer: o.signer || \"\", license: o.license || \"\", at: o.at,\n  });\n  return sha256Text(canon);\n}\n\n/* ---- v1.0.1 signed document (print/PDF, offline, no libs) ---- */\nexport async function buildSignedDocument(study, draft, opts) {\n  const o = opts || {};\n  const at = o.at || new Date().toISOString();\n  const org = o.org || { ar: \"مؤسسة صحية\", en: \"Health Facility\" };\n  const signer = o.signer || \"\";\n  const license = o.license || \"\";\n  const hash = await signedDocHash(study, draft, { signer, license, at });\n  const esc = (s) => String(s == null ? \"\" : s).replace(/[&<>]/g, (ch) => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\" }[ch]));\n  const consultLines = [\n    ...(study.consult ? [`استشارة واردة من ${study.consult.from}: ${study.consult.note || \"—\"}`] : []),\n    ...(study.consultReply ? [`رد المستشار ${study.consultReply.actor}: ${study.consultReply.note || \"—\"}`] : []),\n    ...((study.consultLog || []).map((l) => `سجل: ${l.action} بواسطة ${l.actor} @ ${l.at}`)),\n  ];\n  const html = `\n<div dir=\"rtl\" lang=\"ar\" style=\"font-family:system-ui,'Segoe UI',Tahoma,sans-serif;color:#111;padding:24px;\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #0f172a;padding-bottom:10px;\">\n    <div><div style=\"font-size:1.3rem;font-weight:700;\">${esc(org.ar)}<\/div>\n    <div style=\"font-size:.85rem;color:#444;\" dir=\"ltr\">${esc(org.en)}<\/div><\/div>\n    <div style=\"text-align:left;font-size:.8rem;color:#333;\">Radiology report AI<br/>نظام دعم قرار — ليس تشخيصًا نهائيًا<\/div>\n  <\/div>\n  <h2 style=\"margin:14px 0 6px;\">تقرير تصوير شعاعي موقّع<\/h2>\n  <table style=\"width:100%;border-collapse:collapse;font-size:.9rem;\" cellpadding=\"6\">\n    <tr><td style=\"border:1px solid #999;\"><b>المريض<\/b><\/td><td style=\"border:1px solid #999;\">${esc(study.patient)}<\/td>\n        <td style=\"border:1px solid #999;\"><b>Modality<\/b><\/td><td style=\"border:1px solid #999;\">${esc(study.modality)}<\/td><\/tr>\n    <tr><td style=\"border:1px solid #999;\"><b>معرّف الدراسة<\/b><\/td><td style=\"border:1px solid #999;\" dir=\"ltr\">${esc(study.uid)}<\/td>\n        <td style=\"border:1px solid #999;\"><b>الشرائح<\/b><\/td><td style=\"border:1px solid #999;\">${(study.frames || []).length}<\/td><\/tr>\n    <tr><td style=\"border:1px solid #999;\"><b>الفرز الآلي<\/b><\/td><td style=\"border:1px solid #999;\">${esc(study.triage?.priority || \"-\")} / ${esc(study.triage?.context || \"-\")}<\/td>\n        <td style=\"border:1px solid #999;\"><b>تاريخ التوقيع<\/b><\/td><td style=\"border:1px solid #999;\" dir=\"ltr\">${esc(at)}<\/td><\/tr>\n  <\/table>\n  <h3 style=\"margin:12px 0 4px;\">نص التقرير (عربي)<\/h3>\n  <pre style=\"white-space:pre-wrap;border:1px solid #bbb;padding:10px;font-family:inherit;\">${esc(draft.ar)}<\/pre>\n  <h3 style=\"margin:12px 0 4px;\" dir=\"ltr\">Report (English)<\/h3>\n  <pre dir=\"ltr\" style=\"white-space:pre-wrap;border:1px solid #bbb;padding:10px;font-family:inherit;\">${esc(draft.en)}<\/pre>\n  ${consultLines.length ? `<h3 style=\"margin:12px 0 4px;\">سجل الاستشارة والتدقيق<\/h3><ul style=\"font-size:.85rem;\">${consultLines.map((l) => `<li>${esc(l)}<\/li>`).join(\"\")}<\/ul>` : \"\"}\n  <div style=\"margin-top:22px;border:2px solid #0f172a;padding:12px;\">\n    <div style=\"font-weight:700;\">التوقيع الإلكتروني السريري<\/div>\n    <div style=\"margin-top:6px;\">الاسم: <b>${esc(signer)}<\/b> ${license ? ` — الترخيص: <b>${esc(license)}<\/b>` : \"\"}<\/div>\n    <div>بصفتي الطبيب المسؤول أقرّ بمراجعة الصور وهذا التقرير واعتماده.<\/div>\n    <div style=\"margin-top:8px;font-size:.8rem;\" dir=\"ltr\">Document SHA-256: ${hash}<\/div>\n  <\/div>\n  <div style=\"margin-top:12px;font-size:.75rem;color:#555;\">\n    هذا المستند ناتج عن نظام دعم قرار؛ المسؤولية السريرية النهائية للطبيب الموقّع.\n    Decision-support output; final clinical responsibility rests with the signing physician.\n  <\/div>\n<\/div>`;\n  return { html, hash, at };\n}\n", "mpr": "/* Radiology report AI — multi-planar reconstruction (MPR).\n   Pure, dependency-free maths: build an isotropic-ish volume out of a stack of\n   axial slices, then reslice it into axial / coronal / sagittal planes.\n   No external libraries, no DOM, nothing leaves the device. */\n\nconst PLANE = { axial: \"axial\", coronal: \"coronal\", sagittal: \"sagittal\" };\n\nconst med = (a) => {\n  if (!a.length) return 0;\n  const s = a.slice().sort((x, y) => x - y);\n  const m = s.length >> 1;\n  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;\n};\n\nfunction spacingOf(frame) {\n  // DICOM PixelSpacing is [row spacing (y), column spacing (x)] in mm.\n  const sp = frame && frame.spacing;\n  if (Array.isArray(sp) && sp.length >= 2 && sp[0] > 0 && sp[1] > 0) return { sy: sp[0], sx: sp[1] };\n  return { sy: 1, sx: 1 };\n}\n\nfunction normalFrom(iop) {\n  if (!iop || iop.length < 6) return null;\n  const a = [iop[0], iop[1], iop[2]];\n  const b = [iop[3], iop[4], iop[5]];\n  const n = [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];\n  const len = Math.hypot(n[0], n[1], n[2]);\n  if (!len) return null;\n  return [n[0] / len, n[1] / ound:#fff; }\n      [data-theme=\"light\"] #viewer-name { color:#0f172a; }\n      .empty { color:var(--muted); font-size:.85rem; text-align:center; padding:1.5rem 0; }\n      .hint { color:var(--muted); font-size:.72rem; }\n    .treason{font-size:.65rem;color:#94a3b8;margin-top:.2rem;max-width:8.5rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n      #worklist td:first-child { font-weight:600; color:#e8f0fa; }\n      #worklist th:nth-child(1), #worklist td:nth-child(1) { width:30%; }\n      #worklist th:nth-child(2), #worklist td:nth-child(2) { width:8%; }\n      #worklist th:nth-child(3), #worklist td:nth-child(3) { width:14%; }\n      #worklist th:nth-child(4), #worklist td:nth-child(4) { width:22%; }\n      #worklist th:nth-child(5), #worklist td:nth-child(5) { width:8%; }\n      #worklist th:nth-child(6), #worklist td:nth-child(6) { width:18%; }\n      #worklist td:nth-child(3) { font-size:.82rem; color:#cbd5e1; }\n      .badge.signed { background:#1e3a5f; color:#bfdbfe; margin-inline-start:.35rem; }\n.badge.consult{background:#0ea5e9;}\n#print-root{display:none;}\n@media print{\n  body *{visibility:hidden;}\n  #print-root,#print-root *{visibility:visible;}\n  #print-root{display:block !important;position:absolute;inset:0;width:100%;}\n}\n#viewer-card:fullscreen { overflow:hidden; background:#000; padding:0; max-width:none; display:flex; flex-direction:column; justify-content:flex-end; gap:0; align-items:stretch; }\n#viewer-card:fullscreen #viewport { position:absolute; inset:0; width:100%; height:100%; border-radius:0; display:flex; align-items:center; justify-content:center; }\n#viewer-card:fullscreen h2, #viewer-card:fullscreen p, #viewer-card:fullscreen details { display:none; }\n#viewer-card:fullscreen .controls { position:relative; z-index:5; background:rgba(15,23,42,.85); margin:0; padding:.35rem .6rem; transition:opacity .25s; }\n#viewer-card:fullscreen.fs-hide .controls { opacity:0; pointer-events:none; }\n.fs-fake { position:fixed !important; inset:0 !important; z-index:60; overflow:hidden !important; background:#000; margin:0 !important; max-width:none !important; padding:0; border-radius:0 !important; display:flex !important; flex-direction:column !important; justify-content:flex-end; gap:0; align-items:stretch; }\n.fs-fake #viewport { position:absolute !important; inset:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }\n.fs-fake h2, .fs-fake p, .fs-fake details { display:none; }\n.fs-fake .controls { position:relative; z-index:5; background:rgba(15,23,42,.85); margin:0; padding:.35rem .6rem; transition:opacity .25s; }\n.fs-fake.fs-hide .controls { opacity:0; pointer-events:none; }\n<\/style>\n<header>\n      <h1><img id=\"app-logo\" src=\"./icons/logo.png\" alt=\"Radiology report AI\" style=\"height:2.4rem;width:2.4rem;border-radius:.6rem;vertical-align:middle;margin-inline-end:.55rem;box-shadow:0 0 0 1px #334155;\" />Radiology report AI <button id=\"menu-btn\" class=\"ghost\" style=\"font-size:.8rem;padding:.2rem .6rem;\" title=\"القائمة / Menu\">☰<\/button> <button id=\"settings-btn\" class=\"ghost\" style=\"font-size:.8rem;padding:.2rem .6rem;\" title=\"الإعدادات / Settings\">⚙<\/button> <button id=\"lang-toggle\" class=\"ghost\" style=\"font-size:.7rem;padding:.2rem .6rem;\">EN<\/button><\/h1>\n      <span id=\"subtitle\">نسخة المتصفح — تعمل Offline بالكامل، بياناتك تبقى على جهازك<\/span>\n    <\/header>\n    <p id=\"update-banner\" class=\"hint\" style=\"display:none; color:#fcd34d; padding:0 1.4rem;\"><\/p>\n    <div id=\"drawer\" style=\"position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50;\">\n  <div style=\"position:absolute;inset-inline-start:0;top:0;bottom:0;width:min(320px,86vw);background:#0d1728;border-inline-end:1px solid #334155;padding:1rem;overflow:auto;\">\n    <p style=\"display:flex;justify-content:space-between;align-items:center;margin:0 0 .6rem;\"><b id=\"drawer-title\">القائمة<\/b><button id=\"drawer-close\" class=\"ghost\" style=\"padding:.2rem .6rem;\">✕<\/button><\/p>\n    <p style=\"margin:.1rem 0 .7rem;font-size:.8rem;color:#34d399;\" id=\"drawer-status\">🟢 Offline Ready<\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-worklist\" class=\"ghost\" style=\"width:100%;text-align:start;\">📋 قائمة العمل الرئيسية<\/button><\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-critical\" class=\"ghost\" style=\"width:100%;text-align:start;\">🚨 الحالات الحرجة فقط (0)<\/button><\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-archive\" class=\"ghost\" style=\"width:100%;text-align:start;\">📑 الأرشيف وسجل التقارير<\/button><\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-data\" class=\"ghost\" style=\"width:100%;text-align:start;\">📥 إدارة البيانات (استيراد/تصدير)<\/button><\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-ai\" class=\"ghost\" style=\"width:100%;text-align:start;\">🤖 إعدادات الذكاء الاصطناعي والقوالب<\/button><\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-settings\" class=\"ghost\" style=\"width:100%;text-align:start;\">⚙ الإعدادات العامة<\/button><\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-install\" class=\"ghost\" style=\"width:100%;text-align:start;\">📱 تثبيت التطبيق (PWA)<\/button><\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-help\" class=\"ghost\" style=\"width:100%;text-align:start;\">❓ حول والمساعدة<\/button><\/p>\n  <\/div>\n<\/div>\n<div id=\"settings-modal\" style=\"position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:60;overflow:auto;\">\n  <div style=\"max-width:660px;margin:1.5rem auto;background:#0d1728;border:1px solid #334155;border-radius:.8rem;padding:1rem;\">\n    <p style=\"display:flex;justify-content:space-between;align-items:center;margin:0 0 .6rem;\"><b id=\"settings-title\">⚙ الإعدادات<\/b><button id=\"settings-close\" class=\"ghost\" style=\"padding:.2rem .6rem;\">✕<\/button><\/p>\n    <details id=\"set-pacs\" open style=\"margin:.3rem 0;\">\n      <summary id=\"set-pacs-sum\" style=\"cursor:pointer;\">🖧 خادم الأشعة PACS / DICOMweb<\/summary>\n      <p style=\"margin:.5rem 0 .2rem;font-size:.8rem;\" id=\"lbl-pacs-url-s\">عنوان الخادم (URL):<\/p>\n      <p style=\"margin:.1rem 0 .4rem;\"><input id=\"pacs-url-s\" type=\"text\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\" dir=\"ltr\" /><\/p>\n      <p style=\"margin:.2rem 0 .2rem;font-size:.8rem;\" id=\"lbl-pacs-token\">رمز المصادقة (Token/Bearer — اختياري، يُحفظ على جهازك):<\/p>\n      <p style=\"margin:.1rem 0 .4rem;\"><input id=\"pacs-token\" type=\"password\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\" dir=\"ltr\" /><\/p>\n      <p style=\"margin:.3rem 0 .2rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;\"><label id=\"lbl-pacs-ae\" style=\"opacity:.85;font-size:.78rem;\">AE Title (لأنظمة DICOM القديمة — لا يستخدمه DICOMweb):<\/label><input id=\"pacs-ae\" placeholder=\"PACS-AE\" autocomplete=\"off\" spellcheck=\"false\" style=\"width:8rem;\" /><\/p>\n      <p style=\"margin:.2rem 0 .3rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;\"><label id=\"lbl-pacs-port\" style=\"opacity:.85;font-size:.78rem;\">منفذ اختياري يُضاف للعنوان:<\/label><input id=\"pacs-port\" type=\"number\" min=\"0\" max=\"65535\" placeholder=\"8042\" style=\"width:6rem;\" /><\/p>\n      <p style=\"margin:.2rem 0 .4rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;\"><button id=\"pacs-test\" class=\"ghost\" style=\"padding:.25rem .7rem;font-size:.78rem;\">اختبار الاتصال<\/button><label id=\"lbl-pacs-auto\" style=\"opacity:.85;font-size:.8rem;\">السحب التلقائي:<\/label><select id=\"pacs-auto\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"0\" selected>معطّل<\/option><option value=\"5\">كل 5 دقائق<\/option><option value=\"15\">كل 15 دقيقة<\/option><option value=\"30\">كل 30 دقيقة<\/option><\/select><\/p>\n    <\/details>\n    <details id=\"set-ai\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-ai-sum\" style=\"cursor:pointer;\">🤖 الذكاء الاصطناعي والتنبيهات<\/summary>\n      <p style=\"margin:.5rem 0 .4rem;\"><label id=\"lbl-crit-alert\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"crit-alert\" /> تنبيه صوتي واهتزاز عند اكتشاف حالة حرجة جديدة<\/label><\/p>\n      <p style=\"margin:.2rem 0 .4rem;font-size:.8rem;opacity:.8;\" id=\"set-ai-note\">المعالجة الأساسية محلية دائمًا؛ الذكاء السحابي اختياري بموافقتك لكل طلب.<\/p>\n    <\/details>\n    <details id=\"set-store\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-store-sum\" style=\"cursor:pointer;\">🗄 التخزين والخصوصية<\/summary>\n      <pre id=\"storage-out\" style=\"white-space:pre-wrap;background:#0b1220;border:1px solid #334155;border-radius:.5rem;padding:.5rem;font-family:inherit;font-size:.78rem;margin:.5rem 0;\"><\/pre>\n      <p style=\"margin:.2rem 0 .4rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;\"><button id=\"free-images\" class=\"ghost\" style=\"padding:.25rem .7rem;font-size:.78rem;\">تفريغ صور الدراسات المؤرشفة تقاريرها<\/button><label id=\"lbl-anon\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"anon-exp\" /> إخفاء هوية المريض في حزم الاستشارة المصدّرة<\/label><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-perf-smooth\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"perf-smooth\" checked /> تنعيم الصور (تعطيله يسرّع الشرائح الكثيفة)<\/label><\/p>\n      <p style=\"margin:.3rem 0 .2rem;display:flex;gap:.5rem;flex-wrap:wrap;\"><button id=\"rebuild-cache\" class=\"ghost\" style=\"padding:.25rem .7rem;font-size:.78rem;\">إعادة بناء مخبأ الأوفلاين<\/button><button id=\"clear-db\" class=\"ghost\" style=\"padding:.25rem .7rem;font-size:.78rem;\">تفريغ قاعدة الدراسات المحلية<\/button><\/p>\n    <\/details>\n    <details id=\"set-ui\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-ui-sum\" style=\"cursor:pointer;\">🎨 العرض واللغة<\/summary>\n      <p style=\"margin:.5rem 0 .4rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-lang\" style=\"font-size:.85rem;\">لغة الواجهة:<\/label><select id=\"lang-sel\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"ar\" selected>العربية<\/option><option value=\"en\">English<\/option><\/select><\/p>\n      <p style=\"margin:.3rem 0 .4rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-theme\" style=\"font-size:.85rem;\">المظهر:<\/label><select id=\"theme-sel\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"dark\" selected>داكن طبي عالي التباين<\/option><option value=\"light\">فاتح<\/option><\/select><\/p>\n    <\/details>\n    <details id=\"set-view\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-view-sum\" style=\"cursor:pointer;\">🖥 تفضيلات العارض<\/summary>\n      <p style=\"margin:.5rem 0 .3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-default-win\" style=\"font-size:.85rem;\">النافذة الافتراضية:<\/label><select id=\"default-win-sel\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"auto\" selected>تلقائي<\/option><option value=\"lung\">رئة<\/option><option value=\"mediastinum\">منصف<\/option><option value=\"bone\">عظم<\/option><\/select><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-ov-name\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"ov-name-chk\" checked /> إظهار اسم المريض وبياناته فوق الصورة<\/label><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-ov-meta\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"ov-meta-chk\" checked /> إظهار سطر معلومات الشريحة أسفل العارض<\/label><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-ov-seq\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"ov-seq-chk\" checked /> طبقة معلومات على الصورة: نوع الفحص والتسلسل (T1/T2/FLAIR…)<\/label><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-ov-tech\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"ov-tech-chk\" checked /> إظهار TE/TR داخل طبقة المعلومات (علامة ~ تعني مشتقًا من القياسات لا من الوسم)<\/label><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-ov-diag\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"ov-diag-chk\" /> طبقة تشخيص على الصورة (الإصدار، السلسلة، الأبعاد، النافذة، المدى، التباين) — مفيدة عند طلب الدعم<\/label><\/p>\n      <p style=\"margin:.2rem 0 .3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-measure-color\" style=\"font-size:.85rem;\">لون أدوات القياس:<\/label><input type=\"color\" id=\"measure-color\" value=\"#38bdf8\" style=\"width:3rem;height:2rem;border:1px solid #334155;border-radius:.4rem;background:#0b1220;\" /><label id=\"lbl-measure-unit\" style=\"font-size:.85rem;\">الوحدة:<\/label><select id=\"measure-unit\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"mm\" selected>مليمتر (مم)<\/option><option value=\"cm\">سنتيمتر (سم)<\/option><\/select><\/p>\n    <\/details>\n    <details id=\"set-work\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-work-sum\" style=\"cursor:pointer;\">📋 إعدادات قائمة العمل<\/summary>\n      <p style=\"margin:.5rem 0 .3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-sort\" style=\"font-size:.85rem;\">الفرز الافتراضي:<\/label><select id=\"sort-sel\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"urgent\" selected>الحرج أولًا<\/option><option value=\"date\">الأحدث أولًا<\/option><option value=\"study\" id=\"opt-study\">تاريخ الدراسة<\/option><option value=\"name\">أبجديًا بالاسم<\/option><\/select><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-auto-open\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"auto-open-chk\" /> فتح أول دراسة تلقائيًا بعد الرفع<\/label><\/p>\n    <\/details>\n    <details id=\"set-keys\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-keys-sum\" style=\"cursor:pointer;\">⌨ اختصارات لوحة المفاتيح<\/summary>\n      <p id=\"keys-hint\" style=\"font-size:.78rem;opacity:.85;margin:.4rem 0 .3rem;\">اضغط داخل الحقل ثم اضغط المفتاح المطلوب لتعيينه.<\/p>\n      <p style=\"display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.2rem 0 .3rem;\"><label id=\"ks-next-lbl\" style=\"font-size:.8rem;\">شريحة تالية:<\/label><input id=\"ks-next\" spellcheck=\"false\" style=\"width:5rem;\" /><label id=\"ks-prev-lbl\" style=\"font-size:.8rem;\">شريحة سابقة:<\/label><input id=\"ks-prev\" spellcheck=\"false\" style=\"width:5rem;\" /><label id=\"ks-fit-lbl\" style=\"font-size:.8rem;\">ملاءمة:<\/label><input id=\"ks-fit\" spellcheck=\"false\" style=\"width:5rem;\" /><label id=\"ks-measure-lbl\" style=\"font-size:.8rem;\">قياس:<\/label><input id=\"ks-measure\" spellcheck=\"false\" style=\"width:5rem;\" /><label id=\"ks-zoomin-lbl\" style=\"font-size:.8rem;\">تكبير:<\/label><input id=\"ks-zoom-in\" spellcheck=\"false\" style=\"width:5rem;\" /><label id=\"ks-zoomout-lbl\" style=\"font-size:.8rem;\">تصغير:<\/label><input id=\"ks-zoom-out\" spellcheck=\"false\" style=\"width:5rem;\" /><label id=\"ks-contrast-lbl\" style=\"font-size:.8rem;\">تبديل التباين:<\/label><input id=\"ks-contrast\" spellcheck=\"false\" style=\"width:5rem;\" /><\/p>\n    <\/details>\n    <details id=\"set-io\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-io-sum\" style=\"cursor:pointer;\">📤 الاستيراد والتصدير<\/summary>\n      <p style=\"margin:.5rem 0 .3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-default-export\" style=\"font-size:.85rem;\">تنسيق التصدير الافتراضي:<\/label><select id=\"default-export-sel\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"word\" selected>Word (قالب المستشفى)<\/option><option value=\"pdf\">PDF<\/option><\/select><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-gzip\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"gzip-chk\" /> ضغط حزم الاستشارة (gzip)<\/label><\/p>\n    <\/details>\n    <details id=\"set-priv\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-priv-sum\" style=\"cursor:pointer;\">🔒 الخصوصية والأمان<\/summary>\n      <p style=\"margin:.5rem 0 .3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-set-retention\" style=\"font-size:.85rem;\">حذف تلقائي للمسودات/الدراسات بعد:<\/label><select id=\"set-retention-days\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"30\">٣٠ يومًا<\/option><option value=\"90\" selected>٩٠ يومًا<\/option><option value=\"180\">١٨٠ يومًا<\/option><option value=\"365\">سنة<\/option><option value=\"0\">تعطيل<\/option><\/select><\/p>\n      <p style=\"margin:.2rem 0 .3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-set-retention-signed\" style=\"font-size:.85rem;\">الموقّع بعد:<\/label><select id=\"set-retention-signed\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"90\">٩٠ يومًا<\/option><option value=\"180\">١٨٠ يومًا<\/option><option value=\"365\" selected>سنة<\/option><option value=\"730\">سنتان<\/option><option value=\"0\">تعطيل<\/option><\/select><\/p>\n    <\/details>\n    <details id=\"set-about\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-about-sum\" style=\"cursor:pointer;\">ℹ حول التطبيق<\/summary>\n      <p id=\"about-ver\" style=\"font-size:.85rem;margin:.4rem 0 .2rem;\"><\/p>\n      <p id=\"about-conn\" style=\"font-size:.85rem;margin:.2rem 0;color:#34d399;\"><\/p>\n      <p id=\"about-disclaimer\" style=\"font-size:.78rem;opacity:.85;margin:.3rem 0;\"><\/p>\n      <p id=\"about-privacy\" style=\"font-size:.78rem;opacity:.85;margin:.3rem 0;\"><\/p>\n      <p id=\"about-licenses\" style=\"font-size:.78rem;opacity:.85;margin:.3rem 0;\"><\/p>\n      <p id=\"about-support\" style=\"font-size:.78rem;opacity:.85;margin:.3rem 0;\"><\/p>\n      <p style=\"font-size:.78rem;margin:.5rem 0 0;\"><a href=\"./standalone.html\" style=\"color:#38bdf8;text-decoration:none\">فتح «نسخة الملف الواحد» (تعمل دون أي مصدر خارجي)<\/a> · <a href=\"./diag.html\" style=\"color:#7dd3fc;text-decoration:none\">تشخيص<\/a><\/p>\n    <\/details>\n  <\/div>\n<\/div>\n<main>\n      <section>\n        <h2 id=\"h-upload\">رفع دراسات DICOM<\/h2>\n        <input id=\"files\" type=\"file\" multiple style=\"display:none;\" />\n        <p style=\"margin:.2rem 0 .3rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;\"><button id=\"files-btn\" class=\"ghost\" style=\"padding:.4rem .9rem;\">اختيار الملفات<\/button><span id=\"files-lbl\" class=\"hint\" style=\"opacity:.85;\">لم يتم اختيار أي ملف<\/span><\/p>\n        <input id=\"files-dir\" type=\"file\" webkitdirectory directory multiple style=\"display:none;\" />\n        <p style=\"margin:.3rem 0 .3rem;\"><button id=\"pick-dir\" class=\"ghost\">اختيار مجلد DICOM كامل بدل اختيار الملفات واحدًا واحدًا<\/button><\/p>\n        <p class=\"hint\" id=\"pick-hint\" style=\"margin:0 0 .6rem;\"><\/p>\n        <p>\n          <button id=\"upload\">رفع وتحليل<\/button>\n          <button id=\"demo\" class=\"ghost\">توليد ديمو<\/button>\n        <\/p>\n        <p class=\"hint\" id=\"ingest-status\"><\/p>\n        <details id=\"pacs-set\" style=\"margin:1rem 0;\">\n        <summary id=\"pacs-sum\" style=\"cursor:pointer;opacity:.85;\">سحب من PACS (DICOMweb)<\/summary>\n        <p style=\"margin:.6rem 0 .3rem;\"><input id=\"pacs-url\" type=\"text\" placeholder=\"https://pacs.hospital.local/dicom-web\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\" /><\/p>\n        <p style=\"margin:.3rem 0 .6rem;\"><input id=\"pacs-q\" type=\"text\" placeholder=\"معرف المريض (اختياري)\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\" /><\/p>\n        <p style=\"margin:.6rem 0 .3rem;\"><label id=\"lbl-dl-url\" for=\"pacs-dl-url\" style=\"opacity:.85;\">رابط التنزيل (WeTransfer / ZIP / DICOM)<\/label><\/p>\n        <p style=\"margin:.3rem 0 .6rem;\"><input id=\"pacs-dl-url\" type=\"text\" inputmode=\"url\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"https://we.tl/t-… أو https://…/study.zip أو https://…/study.dcm\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\" /><\/p>\n        <button id=\"pacs-pull\" class=\"ghost\">سحب أول دراسة مطابقة<\/button>\n        <button id=\"pacs-dl\" class=\"ghost\" style=\"margin-inline-start:.5rem;\">سحب من رابط تنزيل (WeTransfer/ZIP/DICOM)<\/button>\n        <p class=\"hint\" id=\"pacs-status\"><\/p>\n        <p class=\"hint\" id=\"pacs-dl-hint\"><\/p>\n      <\/details>\n      <h2 id=\"h-worklist\">قائمة العمل (الحرج أولًا)<\/h2>\n        <table id=\"worklist\">\n          <thead><tr><th id=\"th-patient\">المريض<\/th><th id=\"th-mod\">النوع<\/th><th id=\"th-date\">التاريخ<\/th><th id=\"th-pri\">الأولوية<\/th><th id=\"th-slices\">الشرائح<\/th><th><\/th><\/tr><\/thead>\n          <tbody><\/tbody>\n        <\/table>\n        <p class=\"empty\" id=\"empty\">لا توجد دراسات — ارفع DICOM أو اضغط \"توليد ديمو\".<\/p>\n        <details id=\"data-mgmt\" style=\"margin:.5rem 0 .2rem;\"><summary id=\"data-mgmt-sum\" class=\"ghost\" style=\"display:inline-block;padding:.4rem 1rem;cursor:pointer;\">إدارة البيانات ▾<\/summary>\n        <p style=\"margin:.4rem 0 .2rem;display:flex;gap:.5rem;flex-wrap:wrap;\"><button id=\"export-csv\" class=\"ghost\">تصدير القائمة CSV<\/button> <button id=\"clear-all\" class=\"ghost\">تفريغ القائمة من الجهاز<\/button><\/p><\/details>\n        <p class=\"hint\" id=\"hint-main\">⚙ كل المعالجة تحدث داخل متصفحك: لا سيرفر، لا إنترنت مطلوب بعد التثبيت، ولا بيانات تغادر جهازك. من قائمة المتصفح ⋮ ← \"إضافة إلى الشاشة الرئيسية\" لتثبيتها كتطبيق.<\/p>\n      <\/section>\n      <section class=\"viewer\" id=\"viewer-card\">\n        <h2 id=\"h-viewer\">العارض<\/h2>\n        <p id=\"prior-line\" style=\"display:none;margin:0 0 .3rem;color:#9fc3e8;font-size:.8rem;text-align:center;cursor:pointer;\"><\/p>\n        <p id=\"viewer-name\" style=\"margin:.2rem 0 .45rem;color:#e2e8f0;font-size:.88rem;text-align:center;direction:ltr;display:none;\"><\/p>\n        <div id=\"viewport\" style=\"display:none; position:relative; overflow:hidden; width:100%; background:#000; border-radius:.4rem; touch-action:none;\">\n          <div id=\"vwrap\" style=\"transform-origin:center; position:relative; width:max-content; margin:0 auto;\">\n            <canvas id=\"frame\" style=\"display:none; \"><\/canvas>\n            <canvas id=\"overlay\" style=\"position:absolute; inset:0; pointer-events:none;\"><\/canvas>\n          <\/div>\n          <canvas id=\"annot\" style=\"position:absolute; inset:0; pointer-events:none; display:block;\"><\/canvas>\n        <\/div>\n        <div id=\"img-note\" style=\"display:none; margin:.45rem 0; padding:.55rem .7rem; border:1px solid #f59e0b; border-radius:.45rem; background:#2a1d06; color:#fde68a; font-size:.82rem; line-height:1.8; direction:ltr; text-align:left; word-break:break-word;\">\n          <span id=\"img-note-text\"><\/span>\n          <button id=\"img-note-copy\" class=\"ghost\" style=\"display:none; margin-top:.35rem;\">Copy diagnostics<\/button>\n        <\/div>\n        <div class=\"controls\" id=\"series-bar\" style=\"display:none; flex-wrap:wrap; gap:.35rem;\"><\/div>\n        <div class=\"controls\" id=\"mpr-bar\">\n          <button id=\"mpr-toggle\" class=\"ghost\">MPR: محوري / إكليلي / سهمي<\/button>\n          <span id=\"mpr-note\" class=\"meta\" style=\"font-size:.75rem\"><\/span>\n        <\/div>\n        <div id=\"mpr-grid\" class=\"mpr-grid\" style=\"display:none\">\n          <div class=\"mpr-pane\" id=\"mpr-pane-axial\"><p class=\"mpr-lab\" id=\"mpr-lab-axial\">محوري<\/p><canvas id=\"mpr-c-axial\" width=\"8\" height=\"8\"><\/canvas><\/div>\n          <div class=\"mpr-pane\" id=\"mpr-pane-coronal\"><p class=\"mpr-lab\" id=\"mpr-lab-coronal\">إكليلي<\/p><canvas id=\"mpr-c-coronal\" width=\"8\" height=\"8\"><\/canvas><\/div>\n          <div class=\"mpr-pane\" id=\"mpr-pane-sagittal\"><p class=\"mpr-lab\" id=\"mpr-lab-sagittal\">سهمي<\/p><canvas id=\"mpr-c-sagittal\" width=\"8\" height=\"8\"><\/canvas><\/div>\n        <\/div>\n        <div id=\"dx-foot\" style=\"display:none; margin:.5rem 0; padding:.55rem .7rem; border:1px solid #b45309; border-radius:.45rem; background:#241704; color:#fcd34d; font-size:.8rem; line-height:1.8;\">\n          <span id=\"dx-foot-text\">هذا العارض أداة عرض ومسودة تقرير؛ <b>غير معتمد للتشخيص النهائي<\/b>. القرار السريري يبقى للطبيب المختص.<\/span>\n          <button id=\"dx-foot-ok\" class=\"ghost\" style=\"margin-inline-start:.5rem;\">إخفاء<\/button>\n        <\/div>\n        <div class=\"controls\">\n          <button id=\"zoom-reset\" class=\"ghost\">ملاءمة<\/button>\n          <span id=\"zscale\" class=\"meta\" style=\"margin-inline-start:.5rem\"><\/span>\n          <button id=\"fs-toggle\" class=\"ghost\">ملء الشاشة<\/button>\n          <button id=\"measure\" class=\"ghost\">قياس<\/button>\n          <span id=\"measure-out\"><\/span>\n        <\/div>\n        <div class=\"controls\">\n          <label id=\"lbl-slice\">الشريحة <input id=\"slice\" type=\"range\" min=\"0\" max=\"0\" value=\"0\" /><\/label>\n          <label id=\"lbl-win\">النافذة:\n            <select id=\"preset\">\n              <option value=\"auto\">تلقائي<\/option>\n              <option value=\"lung\">رئة<\/option>\n              <option value=\"mediastinum\">منصف<\/option>\n              <option value=\"bone\">عظم<\/option>\n            <\/select>\n          <\/label>\n        <\/div>\n        <p class=\"meta\" id=\"meta\"><\/p>\n        <p><button id=\"gen-report\" class=\"ghost\">توليد مسودة التقرير (ع/EN)<\/button><\/p>\n        <details id=\"composer-set\" style=\"margin:1rem 0;\">\n          <summary id=\"composer-sum\" style=\"cursor:pointer;opacity:.85;\">تأليف التقرير التشخيصي (نمط تقرير المستشفى)<\/summary>\n          <p style=\"margin:.5rem 0 .3rem;\"><button id=\"tpl-open\" class=\"ghost\">⚙ قوالب الطبيعي والمرضيات (إعدادات)<\/button><\/p>\n          <details id=\"tpl-set\" style=\"margin:.3rem 0;\">\n            <summary id=\"tpl-sum\" style=\"cursor:pointer;opacity:.85;\">قوالب جاهزة حسب المنطقة — إدراج/تعديل/حذف<\/summary>\n            <div id=\"tpl-list\" style=\"margin:.4rem 0;\"><\/div>\n            <details id=\"tpl-edit-set\" style=\"margin:.3rem 0;\">\n              <summary id=\"tpl-edit-sum\" style=\"cursor:pointer;opacity:.85;\">إضافة/تعديل قالب مخصص (يُحفظ على جهازك)<\/summary>\n              <p style=\"margin:.4rem 0 .3rem;\"><input id=\"tpl-name\" type=\"text\" placeholder=\"اسم القالب / Template name\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\" /><\/p>\n              <p style=\"margin:.3rem 0 .3rem;\"><select id=\"tpl-region\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\">\n                <option value=\"brain\">brain<\/option><option value=\"spine\">spine<\/option><option value=\"msk\">msk<\/option><option value=\"chest\">chest<\/option><option value=\"abdomen\">abdomen<\/option><option value=\"generic\">generic<\/option>\n              <\/select><\/p>\n              <p style=\"margin:.3rem 0 .3rem;\"><textarea id=\"tpl-findings\" rows=\"5\" placeholder=\"FINDINGS — سطر لكل جملة\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;direction:ltr;text-align:left;\"><\/textarea><\/p>\n              <p style=\"margin:.3rem 0 .3rem;\"><textarea id=\"tpl-impression\" rows=\"3\" placeholder=\"IMPRESSION — سطر لكل نقطة\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;direction:ltr;text-align:left;\"><\/textarea><\/p>\n              <p style=\"margin:.3rem 0 .5rem;\"><button id=\"tpl-save\" class=\"ghost\">حفظ القالب<\/button><\/p>\n            <\/details>\n          <\/details>\n          <p style=\"margin:.6rem 0 .3rem;\"><label id=\"lbl-ai-provider\" for=\"ai-provider\" style=\"opacity:.85;\">المزوّد (كلها بلا بطاقة ائتمان)<\/label><\/p>\n          <p style=\"margin:.3rem 0 .3rem;\"><select id=\"ai-provider\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\">\n            <option value=\"groq\">Groq — مجاني بلا بطاقة (افتراضي)<\/option>\n            <option value=\"openrouter\">OpenRouter — نماذج :free بلا بطاقة<\/option>\n            <option value=\"gemini\">Google Gemini — إن قبل حسابك التسجيل بلا فوترة<\/option>\n            <option value=\"server\">سيرفر المؤسسة (Vercel) — المفتاح عند القسم لا على الجهاز<\/option>\n          <\/select><\/p>\n          <p style=\"margin:.3rem 0 .3rem;\"><label id=\"lbl-ai-key\" for=\"ai-key\" style=\"opacity:.85;\">مفتاح API (يُحفظ على جهازك فقط)<\/label><\/p>\n          <p style=\"margin:.3rem 0 .3rem; display:flex; gap:.5rem; flex-wrap:wrap;\">\n            <input id=\"ai-key\" type=\"password\" autocomplete=\"off\" placeholder=\"gsk_… (Groq) أو sk-or-… (OpenRouter) أو AIza… (Gemini)\" style=\"flex:1; min-width:12rem; padding:.5rem; border-radius:.4rem; border:1px solid #334155; background:#0b1220; color:#e2e8f0;\" />\n            <button id=\"ai-gen\" class=\"ghost\">توليد بمساعدة AI (مسودة للمراجعة)<\/button>\n          <\/p>\n          <p class=\"hint\" id=\"ai-hint\"><\/p>\n          <p style=\"margin:.3rem 0 .3rem;\"><label id=\"lbl-ai-extra\" for=\"ai-extra\" style=\"opacity:.85;\">لقطات شاشة إضافية للفحص (اختياري — حتى 2، تُرسل مع نفس الموافقة)<\/label><\/p>\n          <p style=\"margin:.3rem 0 .6rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;\"><input id=\"ai-extra\" type=\"file\" accept=\"image/png,image/jpeg\" multiple style=\"display:none;\" /><button id=\"ai-extra-btn\" class=\"ghost\" style=\"padding:.35rem .8rem;\">اختيار الملفات<\/button><span id=\"ai-extra-lbl\" class=\"hint\" style=\"opacity:.85;\">لم يتم اختيار أي ملف<\/span><span id=\"ai-extra-count\" class=\"hint\"><\/span><\/p>\n          <p style=\"margin:.6rem 0 .3rem;\"><label id=\"lbl-rep-exam\" for=\"rep-exam\" style=\"opacity:.85;\">اسم الفحص (Exam)<\/label><\/p>\n          <p style=\"margin:.3rem 0 .6rem;\"><input id=\"rep-exam\" type=\"text\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\" /><\/p>\n          <p style=\"margin:.3rem 0 .3rem;\"><label id=\"lbl-rep-indication\" for=\"rep-indication\" style=\"opacity:.85;\">الدلالة السريرية (Clinical Indication)<\/label><\/p>\n          <p style=\"margin:.3rem 0 .6rem;\"><textarea id=\"rep-indication\" rows=\"2\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><\/textarea><\/p>\n          <p style=\"margin:.3rem 0 .3rem;\"><label id=\"lbl-rep-notes\" for=\"rep-notes\" style=\"opacity:.85;\">ملاحظات خام / إملاء (مصدر أولي للتحويل إلى تقرير)<\/label><\/p>\n          <p style=\"margin:.3rem 0 .6rem;\"><textarea id=\"rep-notes\" rows=\"3\" placeholder=\"مثال: مريض بعد تثبيت قطني قبل 6 سنوات، ألم أسفل الظهر مع اعتلال جذري أيمن…\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><\/textarea><\/p>\n          <p style=\"margin:.3rem 0 .3rem;\"><label id=\"lbl-rep-findings\" for=\"rep-findings\" style=\"opacity:.85;\">الوصف (FINDINGS) — سطر لكل جملة<\/label><\/p>\n          <p style=\"margin:.3rem 0 .6rem;\"><textarea id=\"rep-findings\" rows=\"6\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;direction:ltr;text-align:left;\"><\/textarea><\/p>\n          <p style=\"margin:.3rem 0 .3rem;\"><label id=\"lbl-rep-impression\" for=\"rep-impression\" style=\"opacity:.85;\">الانطباع (IMPRESSION) — سطر لكل نقطة<\/label><\/p>\n          <p style=\"margin:.3rem 0 .6rem;\"><textarea id=\"rep-impression\" rows=\"4\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;direction:ltr;text-align:left;\"><\/textarea><button id=\"mic-imp\" class=\"ghost\" style=\"padding:.2rem .6rem;font-size:.78rem;margin-inline-start:.4rem;\" title=\"إملاء صوتي عبر محرك المتصفح (قد يتطلب إنترنت وفق سياسة المتصفح)\">🎤 إملاء<\/button><\/p>\n          <p style=\"margin:.3rem 0 .6rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-fu\" for=\"fu-months\" style=\"opacity:.85;\">خطة متابعة:<\/label><select id=\"fu-months\" style=\"padding:.4rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"0\" selected>بدون متابعة<\/option><option value=\"3\">مراجعة بعد 3 أشهر<\/option><option value=\"6\">مراجعة بعد 6 أشهر<\/option><option value=\"12\">مراجعة بعد سنة<\/option><\/select><button id=\"preview-a4\" class=\"ghost\" style=\"padding:.2rem .6rem;font-size:.78rem;\">معاينة A4<\/button><button id=\"print-a4\" class=\"ghost\" style=\"padding:.2rem .6rem;font-size:.78rem;\">🖨 طباعة A4<\/button><\/p>\n          <details id=\"a4-set\" style=\"margin:.2rem 0 .5rem;\"><summary id=\"a4-sum\" style=\"cursor:pointer;opacity:.85;font-size:.8rem;\">المعاينة الداخلية A4<\/summary><div id=\"a4-prev\" style=\"background:#fff;color:#111;border-radius:.5rem;padding:1rem;direction:ltr;text-align:left;font-family:Calibri,Arial,sans-serif;font-size:.85rem;\"><\/div><\/details>\n          <details id=\"bank-set\" style=\"margin:.6rem 0;\">\n            <summary id=\"bank-sum\" style=\"cursor:pointer;opacity:.85;\">بنك الصياغات المهنية — اضغط الجملة لإدراجها<\/summary>\n            <div id=\"bank-list\" style=\"margin:.4rem 0;\"><\/div>\n          <\/details>\n          <p class=\"hint\" id=\"composer-hint\"><\/p>\n          <p style=\"margin:.5rem 0 .3rem;\"><button id=\"archive-save\" class=\"ghost\">💾 حفظ التقرير الحالي في الأرشيف<\/button><\/p>\n          <details id=\"archive-set\" style=\"margin:.4rem 0;\">\n            <summary id=\"archive-sum\" style=\"cursor:pointer;opacity:.85;\">أرشيف التقارير المحفوظة (0)<\/summary>\n            <p style=\"margin:.4rem 0 .3rem;\"><label id=\"lbl-archive-q\" for=\"archive-q\" style=\"opacity:.85;\">بحث في الأرشيف (مريض/فحص/بصمة)<\/label><\/p>\n            <p style=\"margin:.3rem 0 .4rem;\"><input id=\"archive-q\" type=\"text\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\" /><\/p>\n            <p style=\"margin:.3rem 0 .4rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-retention\" for=\"retention-days\" style=\"opacity:.85;\">الحذف التلقائي بعد:<\/label><select id=\"retention-days\" style=\"padding:.4rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"30\">30 يوم<\/option><option value=\"90\" selected>3 أشهر (90 يوم)<\/option><option value=\"180\">6 أشهر<\/option><option value=\"365\">سنة<\/option><option value=\"0\">بدون حذف تلقائي<\/option><\/select><label id=\"lbl-retention-signed\" for=\"retention-signed-days\" style=\"opacity:.85;margin-inline-start:.6rem;\">الموقّع يُحذف بعد:<\/label><select id=\"retention-signed-days\" style=\"padding:.4rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"90\">3 أشهر<\/option><option value=\"180\">6 أشهر<\/option><option value=\"365\" selected>سنة<\/option><option value=\"730\">سنتان<\/option><option value=\"0\">بدون حذف<\/option><\/select><button id=\"purge-now\" class=\"ghost\" style=\"padding:.2rem .6rem;font-size:.75rem;\">تنظيف الآن<\/button><\/p>\n            <p id=\"purge-warn\" style=\"display:none;margin:.3rem 0 .4rem;padding:.45rem .6rem;border:1px solid #b45309;background:#2a1a0a;color:#fed7aa;border-radius:.5rem;font-size:.78rem;\"><\/p>\n            <p style=\"margin:.4rem 0 .4rem;display:flex;gap:.5rem;flex-wrap:wrap;\"><button id=\"archive-backup\" class=\"ghost\" style=\"padding:.2rem .6rem;font-size:.75rem;\">⬇ نسخة احتياطية (ملف)<\/button><button id=\"archive-restore\" class=\"ghost\" style=\"padding:.2rem .6rem;font-size:.75rem;\">⬆ استيراد نسخة<\/button><input type=\"file\" id=\"archive-restore-file\" accept=\".json,application/json\" style=\"display:none;\"><\/p>\n            <div id=\"archive-list\"><\/div>\n            <details id=\"stats-set\" style=\"margin:.5rem 0 .2rem;\"><summary id=\"stats-sum\" style=\"cursor:pointer;opacity:.9;\">📊 إحصاءات الجهاز<\/summary><p style=\"margin:.4rem 0;\"><button id=\"stats-refresh\" class=\"ghost\" style=\"padding:.2rem .6rem;font-size:.75rem;\">تحديث الإحصاءات<\/button> <button id=\"stats-csv\" class=\"ghost\" style=\"padding:.2rem .6rem;font-size:.75rem;\">تصدير الإحصاءات CSV<\/button><\/p><pre id=\"stats-out\" style=\"white-space:pre-wrap;background:#0b1220;border:1px solid var(--line);border-radius:.5rem;padding:.6rem;font-family:inherit;font-size:.8rem;margin:.2rem 0 .4rem;\"><\/pre><\/details>\n          <\/details>\n        <\/details>\n        <pre id=\"report-ar\" style=\"display:none; white-space:pre-wrap; text-align:right; color:var(--text); background:#0b1220; border:1px solid var(--line); border-radius:.5rem; padding:.7rem; font-family:inherit; font-size:.82rem;\"><\/pre>\n        <pre id=\"report-en\" style=\"display:none; white-space:pre-wrap; text-align:left; direction:ltr; color:var(--muted); background:#0b1220; border:1px solid var(--line); border-radius:.5rem; padding:.7rem; font-family:inherit; font-size:.78rem;\"><\/pre>\n        <p class=\"controls\" id=\"sign-row\" style=\"display:none\">\n          <label><input type=\"checkbox\" id=\"signoff\" /> اعتماد مراجعة الأخصائي<\/label>\n          <input id=\"signer\" placeholder=\"اسم الأخصائي\" style=\"background:#0b1220; color:var(--text); border:1px solid var(--line); border-radius:.4rem; padding:.3rem .5rem;\" />\n          <button id=\"copy-report\" class=\"ghost\">نسخ المسودة<\/button>\n        <\/p>\n      <\/section>\n    <\/main>\n<div id=\"sign-extra\" style=\"display:none;margin-top:.6rem;gap:.5rem;flex-wrap:wrap;align-items:center;\">\n  <input id=\"signer-license\" placeholder=\"رقم الترخيص/النقابة\" style=\"flex:1;min-width:10rem;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:.4rem;padding:.3rem .5rem;\" />\n  <button id=\"sign-export\" class=\"primary\">توقيع وتصدير PDF<\/button>\n  <button id=\"sign-export-word\" class=\"ghost\">توقيع وتصدير Word<\/button>\n  <details id=\"org-set\" style=\"width:100%;\">\n    <summary id=\"org-sum\" style=\"cursor:pointer;opacity:.85;\">إعدادات ترويسة المؤسسة<\/summary>\n    <div style=\"display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem;\">\n      <input id=\"org-ar\" placeholder=\"اسم المستشفى (عربي)\" style=\"flex:1;min-width:9rem;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:.4rem;padding:.3rem .5rem;\" />\n      <input id=\"org-en\" placeholder=\"Hospital name (EN)\" dir=\"ltr\" style=\"flex:1;min-width:9rem;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:.4rem;padding:.3rem .5rem;\" />\n      <button id=\"org-save\" class=\"ghost\">حفظ الترويسة<\/button>\n    <\/div>\n  <\/details>\n<\/div>\n<div id=\"print-root\"><\/div>\n"}}</script>
<script>
(async () => {
  const boot = document.getElementById("boot");
  const say = (t) => { if (boot) boot.textContent = t; };
  try {
    const P = JSON.parse(document.getElementById("rrai-src").textContent);
    const S = P.src;
    const TOPO = ["consult", "decode", "dicom", "triage", "docx", "measure", "compare", "report", "mpr", "app"];
    const urls = {};
    for (const n of TOPO) {
      let txt = S[n];
      for (const d of TOPO) {
        if (d === n || !urls[d]) continue;
        const rx = d === "decode"
          ? /(["'])\.\/codecs\/decode\.v\d+\.js\1/g
          : new RegExp("([\"'])\\.\\/" + d + "\\.v\\d+\\.js\\1", "g");
        txt = txt.replace(rx, '"' + urls[d] + '"');
      }
      const leftover = txt.match(/from\s*["']\.\//) || txt.match(/import\(\s*["']\.\//);
      if (leftover) throw new Error("unresolved-relative:" + n);
      urls[n] = URL.createObjectURL(new Blob([txt], { type: "text/javascript" }));
    }
    document.body.innerHTML = S.ui;
    say("بدء التطبيق…");
    const mod = await import(urls.app);
    await mod.init();
    const sp = document.getElementById("splash");
    if (sp) sp.remove();
    /* offline + updates: register this build's worker, evict older ones, reload on update */
    try {
      if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
        const reg = await navigator.serviceWorker.register("./sw.v108.js?b=v108", { scope: "./", updateViaCache: "none" });
        try {
          const all = await navigator.serviceWorker.getRegistrations();
          for (const r of all) if (r !== reg) { r.unregister().catch(() => {}); }
        } catch (e) {}
        navigator.serviceWorker.addEventListener("message", (ev) => {
          if (ev.data !== "rrai-sw-updated") return;
          try {
            if (sessionStorage.getItem("rrai-sw-reload")) return;
            sessionStorage.setItem("rrai-sw-reload", "1");
            location.reload();
          } catch (e) {}
        });
      }
    } catch (e) {}
  } catch (e) {
    say("تعذّر التشغيل — " + (e && e.message ? e.message : e));
    const d = document.createElement("div");
    d.className = "err";
    d.textContent = String(e && e.stack ? e.stack : e);
    document.body.appendChild(d);
  }
})();
</script>
