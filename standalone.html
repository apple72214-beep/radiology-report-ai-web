yes\"?>\n<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\"><Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles\" Target=\"styles.xml\"/><\/Relationships>`;\n  const styles = `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<w:styles xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii=\"Calibri\" w:hAnsi=\"Calibri\" w:cs=\"Segoe UI\"/><w:sz w:val=\"22\"/><\/w:rPr><\/w:rPrDefault><\/w:docDefaults><w:style w:type=\"paragraph\" w:default=\"1\" w:styleId=\"Normal\"><w:name w:val=\"Normal\"/><\/w:style><\/w:styles>`;\n  const core = `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<cp:coreProperties xmlns:cp=\"http://schemas.openxmlformats.org/package/2006/metadata/core-properties\" xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:dcterms=\"http://purl.org/dc/terms/\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"><dc:title>${esc(\"تقرير تصوير شعاعي موقّع — \" + study.patient)}<\/dc:title><dc:creator>${esc(m.signer || \"\")}<\/dc:creator><cp:lastModifiedBy>${esc(m.signer || \"\")}<\/cp:lastModifiedBy><dcterms:created xsi:type=\"dcterms:W3CDTF\">${esc(m.at || \"\")}<\/dcterms:created><\/cp:coreProperties>`;\n  const app = `<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<Properties xmlns=\"http://schemas.openxmlformats.org/officeDocument/2006/extended-properties\"><Application>Radiology report AI<\/Application><AppVersion>1.0<\/AppVersion><\/Properties>`;\n  return zipStore([\n    { name: \"[Content_Types].xml\", data: enc.encode(contentTypes) },\n    { name: \"_rels/.rels\", data: enc.encode(rels) },\n    { name: \"word/document.xml\", data: enc.encode(documentXml(study, draft, m)) },\n    { name: \"word/styles.xml\", data: enc.encode(styles) },\n    { name: \"word/_rels/document.xml.rels\", data: enc.encode(docRels) },\n    { name: \"docProps/core.xml\", data: enc.encode(core) },\n    { name: \"docProps/app.xml\", data: enc.encode(app) },\n  ]);\n}\n", "measure": "/* Measurement math — pure, testable. v1.0.3 suite: segments / angles / ROI stats. */\nexport function dist(a, b) { return Math.hypot(b[0] - a[0], b[1] - a[1]); }\nexport function segMm(a, b, spacing) {\n  if (!spacing) return null;\n  const dy = (b[1] - a[1]) * (spacing[0] || spacing[1]);\n  const dx = (b[0] - a[0]) * (spacing[1] || spacing[0]);\n  return Math.hypot(dx, dy);\n}\nexport function angleDeg(p1, v, p2) {\n  const a1 = Math.atan2(p1[1] - v[1], p1[0] - v[0]);\n  const a2 = Math.atan2(p2[1] - v[1], p2[0] - v[0]);\n  let d = Math.abs(a1 - a2) * 180 / Math.PI;\n  if (d > 180) d = 360 - d;\n  return d;\n}\nexport function grayAt(frame, x, y) {\n  const i = (y | 0) * frame.w + (x | 0);\n  if (frame.kind === \"rgb\") {\n    const d = frame.data;\n    return 0.299 * d[i * 3] + 0.587 * d[i * 3 + 1] + 0.114 * d[i * 3 + 2];\n  }\n  return frame.data[i];\n}\nexport function ellipseStats(frame, c, rx, ry) {\n  let n = 0, sum = 0, sum2 = 0, mn = Infinity, mx = -Infinity;\n  const x0 = Math.max(0, Math.ceil(c[0] - rx)), x1 = Math.min(frame.w - 1, Math.floor(c[0] + rx));\n  const y0 = Math.max(0, Math.ceil(c[1] - ry)), y1 = Math.min(frame.h - 1, Math.floor(c[1] + ry));\n  for (let y = y0; y <= y1; y++) {\n    for (let x = x0; x <= x1; x++) {\n      const dx = (x - c[0]) / rx, dy = (y - c[1]) / ry;\n      if (dx * dx + dy * dy > 1) continue;\n      const v = grayAt(frame, x, y);\n      n++; sum += v; sum2 += v * v;\n      if (v < mn) mn = v;\n      if (v > mx) mx = v;\n    }\n  }\n  if (!n) return null;\n  const mean = sum / n;\n  const std = Math.sqrt(Math.max(0, sum2 / n - mean * mean));\n  return { mean, std, min: mn, max: mx, n, unit: frame.hu ? \"HU\" : \"gray\" };\n}\n\n/* A rectangle ROI: every pixel of the box, nothing guessed at the edge. v130.\n   The physician drags two corners; a rectangle is what a radiologist actually\n   wants over a vertebra frame.kind === \"rgb\") {\n    const d = frame.data;\n    return 0.299 * d[i * 3] + 0.587 * d[i * 3 + 1] + 0.114 * d[i * 3 + 2];\n  }\n  return frame.data[i];\n}\nexport function frameGrayFlat(frame) {\n  const n = frame.w * frame.h;\n  const out = new Float32Array(n);\n  for (let i = 0; i < n; i++) {\n    if (frame.kind === \"rgb\") {\n      out[i] = 0.299 * frame.data[i * 3] + 0.587 * frame.data[i * 3 + 1] + 0.114 * frame.data[i * 3 + 2];\n    } else out[i] = frame.data[i];\n  }\n  return out;\n}\n", "report": "/* Radiology report AI — bilingual (AR/EN) structured report draft.\n   Decision-support only: every draft states it requires radiologist review. */\n\nfunction meanStd(data) {\n  let s = 0, s2 = 0;\n  const n = data.length;\n  for (let i = 0; i < n; i++) { const v = data[i]; s += v; s2 += v * v; }\n  const m = s / n;\n  return { m, sd: Math.sqrt(Math.max(0, s2 / n - m * m)) };\n}\n\n/* Coarse 2x2 quadrant analysis of the inner field (skip borders). */\nfunction quadrants(pixels) {\n  const { w, h, data } = pixels;\n  const q = [0, 0, 0, 0], cnt = [0, 0, 0, 0];\n  const x0 = Math.floor(w * 0.15), x1 = Math.floor(w * 0.85);\n  const y0 = Math.floor(h * 0.15), y1 = Math.floor(h * 0.85);\n  for (let y = y0; y < y1; y++) {\n    for (let x = x0; x < x1; x++) {\n      const i = (y < (y0 + y1) / 2 ? 0 : 2) + (x < (x0 + x1) / 2 ? 0 : 1);\n      q[i] += data[y * w + x]; cnt[i]++;\n    }\n  }\n  return q.map((v, i) => v / Math.max(1, cnt[i]));\n}\n\nconst QUAD_AR = [\"الأيسر العلوي\", \"الأيمن العلوي\", \"الأيسر السفلي\", \"الأيمن السفلي\"];\nconst QUAD_EN = [\"upper-left\", \"upper-right\", \"lower-left\", \"lower-right\"];\n\nimport { sha256Text } from \"./consult.v35.js\";\n\nexport function draftReport(study) {\n  const px = study.frames[0];\n  const { m, sd } = meanStd(px.data);\n  const qs = quadrants(px);\n  const qMean = qs.reduce((a, b) => a + b, 0) / 4;\n  let bi = 0;\n  for (let i = 1; i < 4; i++) if (qs[i] > qs[bi]) bi = i;\n  const focal = study.triage && study.triage.priority === \"urgent\";\n  const slices = study.frames.length;\n  const modality = study.modality || \"CR\";\n  const patient = study.patient || \"—\";\n\n  const ar = [\n    \"مسودة تقرير أشعة — توليد آلي لدعم القرار فقط\",\n    `المريض: ${patient} | النوع: ${modality} | الشرائح: ${slices}`,\n    focal\n      ? `الانطباع: ظل بؤري عالي الكثافة يرجَّح أنه آفة، يتمركز في الربع ${QUAD_AR[bi]} من الحقل الداخلي (متوسط كثافة الربع ${Math.round(qs[bi])} مقابل ${Math.round(qMean)} لمتوسط الحقول). الأولوية: حرجة.`\n      : `الانطباع: لا يبرز ظل بؤري عالي الكثافة في الحقول الأربعة (أعلى ربع ${Math.round(qs[bi])} مقابل متوسط ${Math.round(qMean)})؛ النمط ضمن الحدود الروتينية. الأولوية: روتينية.`,\n    `مؤشر الفرز الآلي: ${study.triage ? study.triage.score.toFixed(4) : \"—\"} (عتبة الحرج ≥ 0.01).`,\n    `سياق الفرز: ${study.triage?.context || \"unknown\"} — ${(study.triage?.reasons || []).join(\"؛ \")}.`,\n    ...(study.docHash ? [`بصمة آخر توقيع: ${String(study.docHash).slice(0, 16)}…`] : []),\n    ...((study.measurements?.segments || []).map((s, i) => `قياس ${i + 1}: ${s.mm != null ? s.mm.toFixed(1) + \" مم\" : s.px.toFixed(0) + \" بكسل\"}`)),\n    ...((study.measurements?.angles || []).map((g, i) => `زاوية ${i + 1}: ${g.deg.toFixed(1)}°`)),\n    ...((study.measurements?.rois || []).map((ro, i) => `ROI ${i + 1}: متوسط ${ro.mean.toFixed(1)} ${ro.unit} (σ ${ro.std.toFixed(1)}، n=${ro.n})`)),\n    ...(study.consult ? [`استشارة واردة من ${study.consult.from}: ${study.consult.note || \"—\"}`] : []),\n    ...(study.compare ? [`مقارنة مع ${study.compare.patient || study.compare.uid}: متوسط فرق ${Number(study.compare.meanAbs).toFixed(3)} ونقاط ساخنة ${Number(study.compare.pctHot).toFixed(1)}%.`] : []),\n    ...(study.consultReply ? [`رد المستشار ${study.consultReply.actor}: ${study.consultReply.note || \"—\"}`] : []),\n    ...((study.consultLog || []).map((l) => `سجل: ${l.action} بواسطة ${l.actor} @ ${l.at}`)),\n    study.signedBy ? `الاعتماد: مسجلة بتوقيع ${study.signedBy}.` : \"\",\n    \"التوصية: مراجعة أخصائي الأشعة واعتماد التقرير النهائي — هذه المسودة ليست تشخيصًا.\",\n  ].filter(Boolean).join(\"\\n\");\n\n  const en = [\n    \"Radiology report draft — AI-generated, decision support only\",\n    `Patient: ${patient} | Modality: ${modality} | Slices: ${slices}`,\n    focal\n      ? `Impression: focal high-density opacity suggestive of a lesion, centered in the ${QUAD_EN[bi]} quadrant of the inner field (quadrant mean ${Math.round(qs[bi])} vs field mean ${Math.round(qMean)}). Triage priority: urgent.`\n      : `Impression: no dominant focal high-density opacity across the four quadrants (max quadrant ${Math.round(qs[bi])} vs mean ${Math.round(qMean)}); pattern within routine limits. Triage priority: routine.`,\n    `Automated triage score: ${study.triage ? study.triage.score.toFixed(4) : \"—\"} (urgent threshold >= 0.01).`,\n    `Triage context: ${study.triage?.context || \"unknown\"} — ${(study.triage?.reasons || []).join(\"; \")}.`,\n    study.signedBy ? `Sign-off: recorded under ${study.signedBy}.` : \"\",\n    \"Recommendation: radiologist review and sign-off required — this draft is not a diagnosis.\",\n  ].filter(Boolean).join(\"\\n\");\n\n  return { ar, en };\n}\n\n\nexport async function signedDocHash(study, draft, o) {\n  const canon = JSON.stringify({\n    uid: study.uid, patient: study.patient, modality: study.modality,\n    ar: draft.ar, en: draft.en, signer: o.signer || \"\", license: o.license || \"\", at: o.at,\n  });\n  return sha256Text(canon);\n}\n\n/* ---- v1.0.1 signed document (print/PDF, offline, no libs) ---- */\nexport async function buildSignedDocument(study, draft, opts) {\n  const o = opts || {};\n  const at = o.at || new Date().toISOString();\n  const org = o.org || { ar: \"مؤسسة صحية\", en: \"Health Facility\" };\n  const signer = o.signer || \"\";\n  const license = o.license || \"\";\n  const hash = await signedDocHash(study, draft, { signer, license, at });\n  const esc = (s) => String(s == null ? \"\" : s).replace(/[&<>]/g, (ch) => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\" }[ch]));\n  const consultLines = [\n    ...(study.consult ? [`استشارة واردة من ${study.consult.from}: ${study.consult.note || \"—\"}`] : []),\n    ...(study.consultReply ? [`رد المستشار ${study.consultReply.actor}: ${study.consultReply.note || \"—\"}`] : []),\n    ...((study.consultLog || []).map((l) => `سجل: ${l.action} بواسطة ${l.actor} @ ${l.at}`)),\n  ];\n  const html = `\n<div dir=\"rtl\" lang=\"ar\" style=\"font-family:system-ui,'Segoe UI',Tahoma,sans-serif;color:#111;padding:24px;\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #0f172a;padding-bottom:10px;\">\n    <div><div style=\"font-size:1.3rem;font-weight:700;\">${esc(org.ar)}<\/div>\n    <div style=\"font-size:.85rem;color:#444;\" dir=\"ltr\">${esc(org.en)}<\/div><\/div>\n    <div style=\"text-align:left;font-size:.8rem;color:#333;\">Radiology report AI<br/>نظام دعم قرار — ليس تشخيصًا نهائيًا<\/div>\n  <\/div>\n  <h2 style=\"margin:14px 0 6px;\">تقرير تصوير شعاعي موقّع<\/h2>\n  <table style=\"width:100%;border-collapse:collapse;font-size:.9rem;\" cellpadding=\"6\">\n    <tr><td style=\"border:1px solid #999;\"><b>المريض<\/b><\/td><td style=\"border:1px solid #999;\">${esc(study.patient)}<\/td>\n        <td style=\"border:1px solid #999;\"><b>Modality<\/b><\/td><td style=\"border:1px solid #999;\">${esc(study.modality)}<\/td><\/tr>\n    <tr><td style=\"border:1px solid #999;\"><b>معرّف الدراسة<\/b><\/td><td style=\"border:1px solid #999;\" dir=\"ltr\">${esc(study.uid)}<\/td>\n        <td style=\"border:1px solid #999;\"><b>الشرائح<\/b><\/td><td style=\"border:1px solid #999;\">${(study.frames || []).length}<\/td><\/tr>\n    <tr><td style=\"border:1px solid #999;\"><b>الفرز الآلي<\/b><\/td><td style=\"border:1px solid #999;\">${esc(study.triage?.priority || \"-\")} / ${esc(study.triage?.context || \"-\")}<\/td>\n        <td style=\"border:1px solid #999;\"><b>تاريخ التوقيع<\/b><\/td><td style=\"border:1px solid #999;\" dir=\"ltr\">${esc(at)}<\/td><\/tr>\n  <\/table>\n  <h3 style=\"margin:12px 0 4px;\">نص التقرير (عربي)<\/h3>\n  <pre style=\"white-space:pre-wrap;border:1px solid #bbb;padding:10px;font-family:inherit;\">${esc(draft.ar)}<\/pre>\n  <h3 style=\"margin:12px 0 4px;\" dir=\"ltr\">Report (English)<\/h3>\n  <pre dir=\"ltr\" style=\"white-space:pre-wrap;border:1px solid #bbb;padding:10px;font-family:inherit;\">${esc(draft.en)}<\/pre>\n  ${consultLines.length ? `<h3 style=\"margin:12px 0 4px;\">سجل الاستشارة والتدقيق<\/h3><ul style=\"font-size:.85rem;\">${consultLines.map((l) => `<li>${esc(l)}<\/li>`).join(\"\")}<\/ul>` : \"\"}\n  <div style=\"margin-top:22px;border:2px solid #0f172a;padding:12px;\">\n    <div style=\"font-weight:700;\">التوقيع الإلكتروني السريري<\/div>\n    <div style=\"margin-top:6px;\">الاسم: <b>${esc(signer)}<\/b> ${license ? ` — الترخيص: <b>${esc(license)}<\/b>` : \"\"}<\/div>\n    <div>بصفتي الطبيب المسؤول أقرّ بمراجعة الصور وهذا التقرير واعتماده.<\/div>\n    <div style=\"margin-top:8px;font-size:.8rem;\" dir=\"ltr\">Document SHA-256: ${hash}<\/div>\n  <\/div>\n  <div style=\"margin-top:12px;font-size:.75rem;color:#555;\">\n    هذا المستند ناتج عن نظام دعم قرار؛ المسؤولية السريرية النهائية للطبيب الموقّع.\n    Decision-support output; final clinical responsibility rests with the signing physician.\n  <\/div>\n<\/div>`;\n  return { html, hash, at };\n}\n", "mpr": "/* Radiology report AI — multi-planar reconstruction (MPR).\n   Pure, dependency-free maths: build an isotropic-ish volume out of a stack of\n   axial slices, then reslice it into axial / coronal / sagittal planes.\n   No external libraries, no DOM, nothing leaves the device. */\n\nconst PLANE = { axial: \"axial\", coronal: \"coronal\", sagittal: \"sagittal\" };\n\nconst med = (a) => {\n  if (!a.length) return 0;\n  const s = a.slice().sort((x, y) => x - y);\n  const m = s.length >> 1;\n  return s.length % 2 ? s[m] : (s[m - 1] + s[ --- order the stack along the slice normal ---------------------------- */\n  const n = normalFrom(frames[0].geometry && frames[0].geometry.iop);\n  let order = frames.map((f, i) => i);\n  let zs = null;\n  if (n && frames.every((f) => f.geometry && f.geometry.ipp && f.geometry.ipp.length === 3)) {\n    zs = frames.map((f) => {\n      const p = f.geometry.ipp;\n      return p[0] * n[0] + p[1] * n[1] + p[2] * n[2];\n    });\n    order = order.slice().sort((a, b) => zs[a] - zs[b]);\n  } else if (frames.every((f) => f.geometry && typeof f.geometry.instanceNumber === \"number\" && f.geometry.instanceNumber > 0)) {\n    order = order.slice().sort((a, b) => frames[a].geometry.instanceNumber - frames[b].geometry.instanceNumber);\n  }\n\n  /* --- in-plane + through-plane spacing --------------------------------- */\n  const sp = spacingOf(f0);\n  let sz = 0;\n  if (zs) {\n    const diffs = [];\n    for (let i = 1; i < order.length; i++) {\n      const d = Math.abs(zs[order[i]] - zs[order[i - 1]]);\n      if (d > 1e-4) diffs.push(d);\n    }\n    if (diffs.length) sz = med(diffs);\n  }\n  if (!sz) {\n    for (const i of order) {\n      const g = frames[i].geometry || {};\n      if (g.spacingBetweenSlices > 0) { sz = g.spacingBetweenSlices; break; }\n      if (g.sliceThickness > 0) { sz = g.sliceThickness; break; }\n    }\n  }\n  if (!sz || !(sz > 0)) sz = Math.max(sp.sx, sp.sy);\n\n  /* --- downsample if the volume would not fit comfortably ---------------- */\n  let nx0 = w, ny0 = h, nz = order.length;\n  let ds = 1;\n  while (nx0 * ny0 * nz > maxVoxels && ds < 4) {\n    ds += 1;\n    nx0 = Math.max(1, Math.floor(w / ds));\n    ny0 = Math.max(1, Math.floor(h / ds));\n  }\n\n  const sx = sp.sx * ds, sy = sp.sy * ds;\n  const nx = nx0, ny = ny0;\n  const total = nx * ny * nz;\n\n  let min = Infinity, max = -Infinity;\n  for (const idx of order) {\n    const d = frames[idx].data;\n    const step = Math.max(1, Math.floor(d.length / 20000));\n    for (let i = 0; i < d.length; i += step) { if (d[i] < min) min = d[i]; if (d[i] > max) max = d[i]; }\n  }\n  const allInt = frames.every((f) => f.data instanceof Int16Array || f.data instanceof Uint16Array ||\n                                     f.data instanceof Int8Array || f.data instanceof Uint8Array);\n  const out = storageFor(min, max, allInt, total);\n\n  for (let z = 0; z < nz; z++) {\n    const src = frames[order[z]].data;\n    const base = z * nx * ny;\n    for (let y = 0; y < ny; y++) {\n      const sy0 = y * ds, ro = sy0 * w, ro2 = base + y * nx;\n      for (let x = 0; x < nx; x++) out[ro2 + x] = src[ro + x * ds];\n    }\n  }\n  return {\n    ok: true, nx, ny, nz, sx, sy, sz, data: out, min, max,\n    downsample: ds, ordered: !!zs, flipZ: opts.flipZ !== false,\n  };\n}\n\n/** {w,h,n,sx,sy} of a plane: pixel size + how many slices it has. */\nexport function planeDims(vol, plane) {\n  if (!vol || !vol.ok) return { w: 0, h: 0, n: 0, sx: 1, sy: 1 };\n  if (plane === PLANE.coronal) return { w: vol.nx, h: vol.nz, n: vol.ny, sx: vol.sx, sy: vol.sz };\n  if (plane === PLANE.sagittal) return { w: vol.ny, h: vol.nz, n: vol.nx, sx: vol.sy, sy: vol.sz };\n  return { w: vol.nx, h: vol.ny, n: vol.nz, sx: vol.sx, sy: vol.sy };\n}\n\nconst zToRow = (vol, z) => (vol.flipZ ? vol.nz - 1 - z : z);\nconst rowToZ = (vol, r) => (vol.flipZ ? vol.nz - 1 - r : r);\n\n/** Extract one plane as a frame-shaped object ({w,h,data,kind,spacing}). */\nexport function planeImage(vol, plane, index) {\n  const d = planeDims(vol, plane);\n  if (!d.n) return null;\n  const i = Math.max(0, Math.min(d.n - 1, index | 0));\n  const out = new (vol.data instanceof Float32Array ? Float32Array : Int32Array)(d.w * d.h);\n  const V = vol.data;\n  if (plane === PLANE.coronal) {\n    for (let r = 0; r < d.h; r++) {\n      const z = rowToZ(vol, r), base = z * vol.nx * vol.ny + i * vol.nx, ro = r * d.w;\n      for (let x = 0; x < d.w; x++) out[ro + x] = V[base + x];\n    }\n  } else if (plane === PLANE.sagittal) {\n    for (let r = 0; r < d.h; r++) {\n      const z = rowToZ(vol, r), base = z * vol.nx * vol.ny, ro = r * d.w;\n      for (let y = 0; y < d.w; y++) out[ro + y] = V[base + y * vol.nx + i];\n    }\n  } else {\n    const base = i * vol.nx * vol.ny;\n    for (let k = 0; k < d.w * d.h; k++) out[k] = V[base + k];\n  }\n  return { w: d.w, h: d.h, data: out, kind: \"gray\", photometric: \"MONOCHROME2\", spacing: [d.sy, d.sx] };\n}\n\n/** Which slice of this plane shows volume coordinate c = {x,y,z}. */\nexport function planeIndexFor(vol, plane, c) {\n  if (plane === PLANE.coronal) return c.y | 0;\n  if (plane === PLANE.sagittal) return c.x | 0;\n  return c.z | 0;\n}\n\n/** Click at pixel (px,py) on a plane → volume coordinate {x,y,z}. */\nexport function pointToVolume(vol, plane, index, px, py) {\n  const d = planeDims(vol, plane);\n  const x0 = Math.max(0, Math.min(d.w - 1, px | 0));\n  const y0 = Math.max(0, Math.min(d.h - 1, py | 0));\n  if (plane === PLANE.coronal) return { x: x0, y: index | 0, z: rowToZ(vol, y0) };\n  if (plane === PLANE.sagittal) return { x: index | 0, y: x0, z: rowToZ(vol, y0) };\n  return { x: x0, y: y0, z: index | 0 };\n}\n\n/** Volume coordinate → pixel inside a plane (for the crosshair). */\nexport function volumeToPlanePixel(vol, plane, c) {\n  if (plane === PLANE.coronal) return { px: c.x, py: zToRow(vol, c.z) };\n  if (plane === PLANE.sagittal) return { px: c.y, py: zToRow(vol, c.z) };\n  return { px: c.x, py: c.y };\n}\n\n/** True when through-plane spacing is far coarser than in-plane (reformats are approximate). */\nexport function isAnisotropic(vol) {\n  if (!vol || !vol.ok) return false;\n  const inPlane = Math.min(vol.sx, vol.sy) || 1;\n  return vol.sz / inPlane > 2.5;\n}\n\nexport { PLANE };\n", "viewer-state": "/* Radiology report AI — viewer state: one object, one reducer, no DOM.\n\n   Why this file exists. The viewer's state used to live in a dozen module-level\n   variables — vk, vx, vy, fitK, viewKey, measureMode, mprOn, allOn,\n   currentSeries — eac /* --- how the picture is turned ---------------------------------------------\n   The turn is a CSS transform on the wrapper, so a tap on the screen is a point\n   in the TURNED picture, not in the pixels the file holds. These three pure\n   functions move a point between the two. Every measurement and every pixel\n   value goes through them — which is why they are tested: if they disagreed,\n   a line drawn on a rotated image would measure a different piece of the\n   patient than the one under the physician's finger.\n\n   Continuous coordinates: (0,0) is the corner of the first pixel, (w,h) the far\n   corner of the last. Flips are applied in the TURNED (display) space, because\n   \"flip horizontally\" must mean \"left becomes right ON SCREEN\". */\nexport function orientSize(w, h, o) {\n  const rot = ((Number(o && o.rotate) || 0) % 360 + 360) % 360;\n  return (rot === 90 || rot === 270) ? [h, w] : [w, h];\n}\n/** A point of the image -> the same point of the turned picture. */\nexport function orientPoint(x, y, w, h, o) {\n  const st = o || {};\n  const rot = ((Number(st.rotate) || 0) % 360 + 360) % 360;\n  const sw = rot === 90 || rot === 270;\n  let X = x, Y = y;\n  if (rot === 90) { X = h - y; Y = x; }\n  else if (rot === 180) { X = w - x; Y = h - y; }\n  else if (rot === 270) { X = y; Y = w - x; }\n  return [st.flipH ? (sw ? h : w) - X : X, st.flipV ? (sw ? w : h) - Y : Y];\n}\n/** A point of the turned picture -> the pixel it really is. */\nexport function unorientPoint(u, v, w, h, o) {\n  const st = o || {};\n  const rot = ((Number(st.rotate) || 0) % 360 + 360) % 360;\n  const sw = rot === 90 || rot === 270;\n  const X = st.flipH ? (sw ? h : w) - u : u;\n  const Y = st.flipV ? (sw ? w : h) - v : v;\n  if (rot === 90) return [Y, h - X];\n  if (rot === 180) return [w - X, h - Y];\n  if (rot === 270) return [w - Y, X];\n  return [X, Y];\n}\n\n/** One row of the series list: what it is, and what it can actually show. */\nfunction normSeries(x) {\n  if (!x || typeof x !== \"object\") return null;\n  if (x.id == null) return null;\n  const sp = x.spacing && typeof x.spacing === \"object\" ? x.spacing : null;\n  return {\n    id: String(x.id),\n    label: String(x.label || \"\"),\n    modality: x.modality ? String(x.modality) : \"\",\n    count: Math.max(0, Math.floor(Number(x.count) || 0)),\n    w: Math.max(0, Math.floor(Number(x.w) || 0)),\n    h: Math.max(0, Math.floor(Number(x.h) || 0)),\n    /* millimetres per pixel — a measurement without it is a number, not a length */\n    spacing: sp ? { x: Number(sp.x) || 0, y: Number(sp.y) || 0 } : null,\n    reslice: !!x.reslice,\n    reason: x.reason ? String(x.reason) : \"\",\n  };\n}\n\nexport function initialViewerState() {\n  return {\n    studyId: null,\n    series: [],\n    seriesId: null,\n    sliceIndex: 0,\n    totalSlices: 0,\n    tool: \"scroll\",           // exactly one tool is live — never two at once\n    layout: \"single\",         // single | mpr | all | compare\n    zoom: 1,                  // relative to fit-to-screen\n    panX: 0,\n    panY: 0,\n    cine: false,\n    cineMs: CINE_MS_DEFAULT,\n    /* null = automatic window (percentile): the default that makes MR readable */\n    windowLevel: { window: null, level: null },\n    identityHidden: false,\n    /* v130 — how the picture is turned on screen. Display only: the pixels, the\n       pixel value and every measurement stay in the acquisition's own frame. */\n    invert: false,\n    rotate: 0,                 // 0 | 90 | 180 | 270 — quarter turns, clockwise\n    flipH: false,\n    flipV: false,\n    loading: false,\n    error: null,\n  };\n}\n\nexport function seriesOf(state, id) {\n  const list = state && state.series;\n  if (!list || !list.length || id == null) return null;\n  const want = String(id);\n  for (let i = 0; i < list.length; i++) if (list[i] && list[i].id === want) return list[i];\n  return null;\n}\n\n/* The same djb2 hash the consult export uses, so a masked name on screen and a\n   mask vents:none; }\n.fs-fake { position:fixed !important; inset:0 !important; z-index:60; overflow:hidden !important; background:#000; margin:0 !important; max-width:none !important; padding:0; border-radius:0 !important; display:flex !important; flex-direction:column !important; justify-content:flex-end; gap:0; align-items:stretch; }\n.fs-fake #viewport { position:absolute !important; inset:0; width:100%; height:100%; display:flex !important; align-items:center !important; justify-content:center !important; box-sizing:border-box !important; }\n.fs-fake h2, .fs-fake p, .fs-fake details { display:none !important; }\n.fs-fake .controls { position:relative; z-index:5; background:rgba(15,23,42,.85); margin:0; padding:.35rem .6rem; transition:opacity .25s; }\n.fs-fake.fs-hide .controls { opacity:0; pointer-events:none; }\n      /* v130 — compare side by side */\n      #cmp-scrim { position:fixed; inset:0; background:rgba(2,6,23,.62); z-index:55; }\n      #cmp-sheet { position:fixed; inset-inline:0; bottom:0; z-index:60; background:#0f172a; border:1px solid #334155; border-bottom:0; border-radius:14px 14px 0 0; padding:.6rem .7rem 1rem; max-height:88vh; overflow:auto; box-shadow:0 -10px 34px rgba(0,0,0,.55); }\n      @media (min-width:820px){ #cmp-sheet { inset-inline:auto; left:50%; transform:translateX(-50%); width:min(980px,96vw); border-radius:14px; border-bottom:1px solid #334155; bottom:1.5rem; } }\n      #cmp-grid { display:flex; gap:.6rem; flex-wrap:wrap; }\n      .cmp-pane { flex:1 1 260px; min-width:220px; background:#0b1220; border:1px solid #334155; border-radius:.5rem; padding:.45rem; overflow:hidden; }\n      .cmp-head { font-size:.82rem; color:#e2e8f0; margin-bottom:.3rem; font-weight:600; line-height:1.4; }\n      .cmp-cv { width:100%; height:auto; display:block; background:#000; border-radius:.35rem; touch-action:none; margin-inline:auto; }\n      .cmp-sub { font-size:.75rem; color:#94a3b8; margin-top:.25rem; direction:ltr; text-align:left; }\n      #series-scrim { position:fixed; inset:0; background:rgba(2,6,23,.62); z-index:55; }\n      #series-sheet { position:fixed; inset-inline:0; bottom:0; z-index:60; background:#0f172a; border:1px solid #334155; border-bottom:0; border-radius:14px 14px 0 0; padding:.6rem .7rem 1rem; max-height:66vh; overflow:auto; box-shadow:0 -10px 34px rgba(0,0,0,.55); }\n      @media (min-width:820px){ #series-sheet { inset-inline:auto; left:50%; transform:translateX(-50%); width:min(560px,94vw); border-radius:14px; border-bottom:1px solid #334155; bottom:1.5rem; } }\n      .sheet-head { display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin:0 0 .5rem; }\n      .sheet-row { display:flex; align-items:center; gap:.6rem; width:100%; text-align:start; background:#1e293b; color:#e2e8f0; border:1px solid #334155; border-radius:.5rem; padding:.4rem .5rem; margin-bottom:.35rem; cursor:pointer; font:inherit; }\n      .sheet-row.on { border-color:#38bdf8; box-shadow:inset 0 0 0 1px #38bdf8; }\n      .sheet-thumb { width:46px; height:46px; border-radius:.3rem; background:#000; border:1px solid #334155; object-fit:cover; flex:0 0 auto; }\n      .sheet-txt { flex:1 1 auto; font-size:.86rem; line-height:1.5; }\n      .sheet-meta { flex:0 0 auto; font-size:.72rem; color:#94a3b8; }\n      .sheet-mark { flex:0 0 auto; width:1.3rem; text-align:center; color:#38bdf8; font-weight:700; }\n      #film-wrap { margin:.35rem 0 .1rem; }\n      #filmstrip { display:flex; gap:.3rem; overflow-x:auto; padding:.3rem .25rem; background:#0b1220; border:1px solid #334155; border-radius:.5rem; touch-action:pan-y; scrollbar-width:thin; }\n      .film-cell { position:relative; flex:0 0 auto; width:58px; height:58px; padding:0; background:#000; border:1px solid #334155; border-radius:.35rem; cursor:pointer; overflow:hidden; }\n      .film-cell.on { border-color:#38bdf8; box-shadow:inset 0 0 0 1px #38bdf8; }\n      .film-img { width:100%; height:100%; object-fit:cover; display:block; }\n      .film-num { position:absolute; bottom:0; inset-inline-end:0; background:rgba(2,6,23,.74); color:#e2e8f0; font-size:.62rem; line-height:1.3; padding:0 .22rem; border-radius:.25rem 0 0 0; }\n      /* v130 — in fullscreen the settings rows used to sit over the bottom of the\n         picture. They fold into one slim line; the picture keeps the screen. */\n      .fs-mini { display:none; }\n      .fs-fake .fs-mini, #viewer-card:fullscreen .fs-mini { display:flex; position:fixed; inset-inline:0; bottom:0; z-index:9; align-items:center; gap:.5rem; padding:.35rem .6rem; background:rgba(15,23,42,.86); border-top:1px solid #334155; font-size:.8rem; }\n      .fs-mini .ghost { padding:.28rem .65rem; font-size:.8rem; }\n      #fs-count { color:#e2e8f0; font-variant-numeric:tabular-nums; direction:ltr; }\n      /* v130 (2): the viewer's settings are one foldable group. */\n      #viewer-settings { margin:.35rem 0 .5rem; padding:.5rem .6rem; border:1px solid #334155; border-radius:.5rem; background:rgba(30,41,59,.45); }\n      [hidden] { display:none !important; }\n      .fs-fake:not(.fs-folded) #viewer-settings, #viewer-card:fullscreen:not(.fs-folded) #viewer-settings { display:block !important; position:relative; z-index:5; }\n      .fs-fake #vs-fold, #viewer-card:fullscreen #vs-fold { display:none !important; }\n      #viewer-settings .controls { margin:.18rem 0; }\n      #viewer-bar { margin:.35rem 0 .1rem; }\n      .fs-fake.fs-folded .controls, #viewer-card:fullscreen.fs-folded .controls { display:none !important; }\n      .fs-fake.fs-folded #viewer-settings, #viewer-card:fullscreen.fs-folded #viewer-settings { display:none !important; }\n      .fs-fake.fs-folded #film-wrap, #viewer-card:fullscreen.fs-folded #film-wrap,\n      .fs-fake.fs-folded #meta, #viewer-card:fullscreen.fs-folded #meta,\n      .fs-fake.fs-folded #dx-foot, #viewer-card:fullscreen.fs-folded #dx-foot,\n      .fs-fake.fs-folded #series-open, #viewer-card:fullscreen.fs-folded #series-open,\n      .fs-fake.fs-folded #series-bar, #viewer-card:fullscreen.fs-folded #series-bar,\n      .fs-fake.fs-folded #gen-report, #viewer-card:fullscreen.fs-folded #gen-report { display:none !important; }\n<\/style>\n<header>\n      <h1><img id=\"app-logo\" src=\"./icons/logo.png\" alt=\"Radiology report AI\" style=\"height:2.4rem;width:2.4rem;border-radius:.6rem;vertical-align:middle;margin-inline-end:.55rem;box-shadow:0 0 0 1px #334155;\" />Radiology report AI <button id=\"menu-btn\" class=\"ghost\" style=\"font-size:.8rem;padding:.2rem .6rem;\" title=\"القائمة / Menu\">☰<\/button> <button id=\"settings-btn\" class=\"ghost\" style=\"font-size:.8rem;padding:.2rem .6rem;\" title=\"الإعدادات / Settings\">⚙<\/button> <button id=\"lang-toggle\" class=\"ghost\" style=\"font-size:.7rem;padding:.2rem .6rem;\">EN<\/button><\/h1>\n      <span id=\"subtitle\">نسخة المتصفح — تعمل Offline بالكامل، بياناتك تبقى على جهازك<\/span>\n    <\/header>\n    <p id=\"update-banner\" class=\"hint\" style=\"display:none; color:#fcd34d; padding:0 1.4rem;\"><\/p>\n    <div id=\"drawer\" style=\"position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50;\">\n  <div style=\"position:absolute;inset-inline-start:0;top:0;bottom:0;width:min(320px,86vw);background:#0d1728;border-inline-end:1px solid #334155;padding:1rem;overflow:auto;\">\n    <p style=\"display:flex;justify-content:space-between;align-items:center;margin:0 0 .6rem;\"><b id=\"drawer-title\">القائمة<\/b><button id=\"drawer-close\" class=\"ghost\" style=\"padding:.2rem .6rem;\">✕<\/button><\/p>\n    <p style=\"margin:.1rem 0 .7rem;font-size:.8rem;color:#34d399;\" id=\"drawer-status\">🟢 Offline Ready<\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-worklist\" class=\"ghost\" style=\"width:100%;text-align:start;\">📋 قائمة العمل الرئيسية<\/button><\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-critical\" class=\"ghost\" style=\"width:100%;text-align:start;\">🚨 الحالات الحرجة فقط (0)<\/button><\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-archive\" class=\"ghost\" style=\"width:100%;text-align:start;\">📑 الأرشيف وسجل التقارير<\/button><\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-data\" class=\"ghost\" style=\"width:100%;text-align:start;\">📥 إدارة البيانات (استيراد/تصدير)<\/button><\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-ai\" class=\"ghost\" style=\"width:100%;text-align:start;\">🤖 إعدادات الذكاء الاصطناعي والقوالب<\/button><\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-settings\" class=\"ghost\" style=\"width:100%;text-align:start;\">⚙ الإعدادات العامة<\/button><\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-install\" class=\"ghost\" style=\"width:100%;text-align:start;\">📱 تثبيت التطبيق (PWA)<\/button><\/p>\n    <p style=\"margin:.25rem 0;\"><button id=\"drawer-help\" class=\"ghost\" style=\"width:100%;text-align:start;\">❓ حول والمساعدة<\/button><\/p>\n  <\/div>\n<\/div>\n<div id=\"settings-modal\" style=\"position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:60;overflow:auto;\">\n  <div style=\"max-width:660px;margin:1.5rem auto;background:#0d1728;border:1px solid #334155;border-radius:.8rem;padding:1rem;\">\n    <p style=\"display:flex;justify-content:space-between;align-items:center;margin:0 0 .6rem;\"><b id=\"settings-title\">⚙ الإعدادات<\/b><button id=\"settings-close\" class=\"ghost\" style=\"padding:.2rem .6rem;\">✕<\/button><\/p>\n    <details id=\"set-pacs\" open style=\"margin:.3rem 0;\">\n      <summary id=\"set-pacs-sum\" style=\"cursor:pointer;\">🖧 خادم الأشعة PACS / DICOMweb<\/summary>\n      <p style=\"margin:.5rem 0 .2rem;font-size:.8rem;\" id=\"lbl-pacs-url-s\">عنوان الخادم (URL):<\/p>\n      <p style=\"margin:.1rem 0 .4rem;\"><input id=\"pacs-url-s\" type=\"text\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\" dir=\"ltr\" /><\/p>\n      <p style=\"margin:.2rem 0 .2rem;font-size:.8rem;\" id=\"lbl-pacs-token\">رمز المصادقة (Token/Bearer — اختياري، يُحفظ على جهازك):<\/p>\n      <p style=\"margin:.1rem 0 .4rem;\"><input id=\"pacs-token\" type=\"password\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\" dir=\"ltr\" /><\/p>\n      <p style=\"margin:.3rem 0 .2rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;\"><label id=\"lbl-pacs-ae\" style=\"opacity:.85;font-size:.78rem;\">AE Title (لأنظمة DICOM القديمة — لا يستخدمه DICOMweb):<\/label><input id=\"pacs-ae\" placeholder=\"PACS-AE\" autocomplete=\"off\" spellcheck=\"false\" style=\"width:8rem;\" /><\/p>\n      <p style=\"margin:.2rem 0 .3rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;\"><label id=\"lbl-pacs-port\" style=\"opacity:.85;font-size:.78rem;\">منفذ اختياري يُضاف للعنوان:<\/label><input id=\"pacs-port\" type=\"number\" min=\"0\" max=\"65535\" placeholder=\"8042\" style=\"width:6rem;\" /><\/p>\n      <p style=\"margin:.2rem 0 .4rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;\"><button id=\"pacs-test\" class=\"ghost\" style=\"padding:.25rem .7rem;font-size:.78rem;\">اختبار الاتصال<\/button><label id=\"lbl-pacs-auto\" style=\"opacity:.85;font-size:.8rem;\">السحب التلقائي:<\/label><select id=\"pacs-auto\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"0\" selected>معطّل<\/option><option value=\"5\">كل 5 دقائق<\/option><option value=\"15\">كل 15 دقيقة<\/option><option value=\"30\">كل 30 دقيقة<\/option><\/select><\/p>\n    <\/details>\n    <details id=\"set-ai\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-ai-sum\" style=\"cursor:pointer;\">🤖 الذكاء الاصطناعي والتنبيهات<\/summary>\n      <p style=\"margin:.5rem 0 .4rem;\"><label id=\"lbl-crit-alert\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"crit-alert\" /> تنبيه صوتي واهتزاز عند اكتشاف حالة حرجة جديدة<\/label><\/p>\n      <p style=\"margin:.2rem 0 .4rem;font-size:.8rem;opacity:.8;\" id=\"set-ai-note\">المعالجة الأساسية محلية دائمًا؛ الذكاء السحابي اختياري بموافقتك لكل طلب.<\/p>\n    <\/details>\n    <details id=\"set-store\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-store-sum\" style=\"cursor:pointer;\">🗄 التخزين والخصوصية<\/summary>\n      <pre id=\"storage-out\" style=\"white-space:pre-wrap;background:#0b1220;border:1px solid #334155;border-radius:.5rem;padding:.5rem;font-family:inherit;font-size:.78rem;margin:.5rem 0;\"><\/pre>\n      <p style=\"margin:.2rem 0 .4rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;\"><button id=\"free-images\" class=\"ghost\" style=\"padding:.25rem .7rem;font-size:.78rem;\">تفريغ صور الدراسات المؤرشفة تقاريرها<\/button><label id=\"lbl-anon\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"anon-exp\" /> إخفاء هوية المريض في حزم الاستشارة المصدّرة<\/label><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-perf-smooth\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"perf-smooth\" checked /> تنعيم الصور (تعطيله يسرّع الشرائح الكثيفة)<\/label><\/p>\n      <p style=\"margin:.3rem 0 .2rem;display:flex;gap:.5rem;flex-wrap:wrap;\"><button id=\"rebuild-cache\" class=\"ghost\" style=\"padding:.25rem .7rem;font-size:.78rem;\">إعادة بناء مخبأ الأوفلاين<\/button><button id=\"clear-db\" class=\"ghost\" style=\"padding:.25rem .7rem;font-size:.78rem;\">تفريغ قاعدة الدراسات المحلية<\/button><\/p>\n    <\/details>\n    <details id=\"set-ui\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-ui-sum\" style=\"cursor:pointer;\">🎨 العرض واللغة<\/summary>\n      <p style=\"margin:.5rem 0 .4rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-lang\" style=\"font-size:.85rem;\">لغة الواجهة:<\/label><select id=\"lang-sel\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"ar\" selected>العربية<\/option><option value=\"en\">English<\/option><\/select><\/p>\n      <p style=\"margin:.3rem 0 .4rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-theme\" style=\"font-size:.85rem;\">المظهر:<\/label><select id=\"theme-sel\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"dark\" selected>داكن طبي عالي التباين<\/option><option value=\"light\">فاتح<\/option><\/select><\/p>\n    <\/details>\n    <details id=\"set-view\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-view-sum\" style=\"cursor:pointer;\">🖥 تفضيلات العارض<\/summary>\n      <p style=\"margin:.5rem 0 .3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-default-win\" style=\"font-size:.85rem;\">النافذة الافتراضية:<\/label><select id=\"default-win-sel\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"auto\" selected>تلقائي<\/option><option value=\"lung\">رئة<\/option><option value=\"mediastinum\">منصف<\/option><option value=\"bone\">عظم<\/option><\/select><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-ov-name\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"ov-name-chk\" checked /> إظهار اسم المريض وبياناته فوق الصورة<\/label><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-ov-meta\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"ov-meta-chk\" checked /> إظهار سطر معلومات الشريحة أسفل العارض<\/label><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-ov-seq\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"ov-seq-chk\" checked /> طبقة معلومات على الصورة: نوع الفحص والتسلسل (T1/T2/FLAIR…)<\/label><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-ov-tech\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"ov-tech-chk\" checked /> إظهار TE/TR داخل طبقة المعلومات (علامة ~ تعني مشتقًا من القياسات لا من الوسم)<\/label><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-ov-diag\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"ov-diag-chk\" /> طبقة تشخيص على الصورة (الإصدار، السلسلة، الأبعاد، النافذة، المدى، التباين) — مفيدة عند طلب الدعم<\/label><\/p>\n      <p style=\"margin:.2rem 0 .3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-measure-color\" style=\"font-size:.85rem;\">لون أدوات القياس:<\/label><input type=\"color\" id=\"measure-color\" value=\"#38bdf8\" style=\"width:3rem;height:2rem;border:1px solid #334155;border-radius:.4rem;background:#0b1220;\" /><label id=\"lbl-measure-unit\" style=\"font-size:.85rem;\">الوحدة:<\/label><select id=\"measure-unit\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"mm\" selected>مليمتر (مم)<\/option><option value=\"cm\">سنتيمتر (سم)<\/option><\/select><\/p>\n    <\/details>\n    <details id=\"set-work\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-work-sum\" style=\"cursor:pointer;\">📋 إعدادات قائمة العمل<\/summary>\n      <p style=\"margin:.5rem 0 .3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-sort\" style=\"font-size:.85rem;\">الفرز الافتراضي:<\/label><select id=\"sort-sel\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"urgent\" selected>الحرج أولًا<\/option><option value=\"date\">الأحدث أولًا<\/option><option value=\"study\" id=\"opt-study\">تاريخ الدراسة<\/option><option value=\"name\">أبجديًا بالاسم<\/option><\/select><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-auto-open\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"auto-open-chk\" /> فتح أول دراسة تلقائيًا بعد الرفع<\/label><\/p>\n    <\/details>\n    <details id=\"set-keys\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-keys-sum\" style=\"cursor:pointer;\">⌨ اختصارات لوحة المفاتيح<\/summary>\n      <p id=\"keys-hint\" style=\"font-size:.78rem;opacity:.85;margin:.4rem 0 .3rem;\">اضغط داخل الحقل ثم اضغط المفتاح المطلوب لتعيينه.<\/p>\n      <p style=\"display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.2rem 0 .3rem;\"><label id=\"ks-next-lbl\" style=\"font-size:.8rem;\">شريحة تالية:<\/label><input id=\"ks-next\" spellcheck=\"false\" style=\"width:5rem;\" /><label id=\"ks-prev-lbl\" style=\"font-size:.8rem;\">شريحة سابقة:<\/label><input id=\"ks-prev\" spellcheck=\"false\" style=\"width:5rem;\" /><label id=\"ks-fit-lbl\" style=\"font-size:.8rem;\">ملاءمة:<\/label><input id=\"ks-fit\" spellcheck=\"false\" style=\"width:5rem;\" /><label id=\"ks-measure-lbl\" style=\"font-size:.8rem;\">قياس:<\/label><input id=\"ks-measure\" spellcheck=\"false\" style=\"width:5rem;\" /><label id=\"ks-zoomin-lbl\" style=\"font-size:.8rem;\">تكبير:<\/label><input id=\"ks-zoom-in\" spellcheck=\"false\" style=\"width:5rem;\" /><label id=\"ks-zoomout-lbl\" style=\"font-size:.8rem;\">تصغير:<\/label><input id=\"ks-zoom-out\" spellcheck=\"false\" style=\"width:5rem;\" /><label id=\"ks-contrast-lbl\" style=\"font-size:.8rem;\">تبديل التباين:<\/label><input id=\"ks-contrast\" spellcheck=\"false\" style=\"width:5rem;\" /><\/p>\n    <\/details>\n    <details id=\"set-io\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-io-sum\" style=\"cursor:pointer;\">📤 الاستيراد والتصدير<\/summary>\n      <p style=\"margin:.5rem 0 .3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-default-export\" style=\"font-size:.85rem;\">تنسيق التصدير الافتراضي:<\/label><select id=\"default-export-sel\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"word\" selected>Word (قالب المستشفى)<\/option><option value=\"pdf\">PDF<\/option><\/select><\/p>\n      <p style=\"margin:.2rem 0 .3rem;\"><label id=\"lbl-gzip\" style=\"font-size:.85rem;\"><input type=\"checkbox\" id=\"gzip-chk\" /> ضغط حزم الاستشارة (gzip)<\/label><\/p>\n    <\/details>\n    <details id=\"set-priv\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-priv-sum\" style=\"cursor:pointer;\">🔒 الخصوصية والأمان<\/summary>\n      <p style=\"margin:.5rem 0 .3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-set-retention\" style=\"font-size:.85rem;\">حذف تلقائي للمسودات/الدراسات بعد:<\/label><select id=\"set-retention-days\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"30\">٣٠ يومًا<\/option><option value=\"90\" selected>٩٠ يومًا<\/option><option value=\"180\">١٨٠ يومًا<\/option><option value=\"365\">سنة<\/option><option value=\"0\">تعطيل<\/option><\/select><\/p>\n      <p style=\"margin:.2rem 0 .3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;\"><label id=\"lbl-set-retention-signed\" style=\"font-size:.85rem;\">الموقّع بعد:<\/label><select id=\"set-retention-signed\" style=\"padding:.3rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\"><option value=\"90\">٩٠ يومًا<\/option><option value=\"180\">١٨٠ يومًا<\/option><option value=\"365\" selected>سنة<\/option><option value=\"730\">سنتان<\/option><option value=\"0\">تعطيل<\/option><\/select><\/p>\n    <\/details>\n    <details id=\"set-about\" style=\"margin:.3rem 0;\">\n      <summary id=\"set-about-sum\" style=\"cursor:pointer;\">ℹ حول التطبيق<\/summary>\n      <p id=\"about-ver\" style=\"font-size:.85rem;margin:.4rem 0 .2rem;\"><\/p>\n      <p id=\"about-conn\" style=\"font-size:.85rem;margin:.2rem 0;color:#34d399;\"><\/p>\n      <p id=\"about-disclaimer\" style=\"font-size:.78rem;opacity:.85;margin:.3rem 0;\"><\/p>\n      <p id=\"about-privacy\" style=\"font-size:.78rem;opacity:.85;margin:.3rem 0;\"><\/p>\n      <p id=\"about-licenses\" style=\"font-size:.78rem;opacity:.85;margin:.3rem 0;\"><\/p>\n      <p id=\"about-support\" style=\"font-size:.78rem;opacity:.85;margin:.3rem 0;\"><\/p>\n      <p style=\"font-size:.78rem;margin:.5rem 0 0;\"><a href=\"./standalone.html\" style=\"color:#38bdf8;text-decoration:none\">فتح «نسخة الملف الواحد» (تعمل دون أي مصدر خارجي)<\/a> · <a href=\"./diag.html\" style=\"color:#7dd3fc;text-decoration:none\">تشخيص<\/a><\/p>\n    <\/details>\n  <\/div>\n<\/div>\n<main>\n      <section>\n        <h2 id=\"h-upload\">رفع دراسات DICOM<\/h2>\n        <input id=\"files\" type=\"file\" multiple style=\"display:none;\" />\n        <p style=\"margin:.2rem 0 .3rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;\"><button id=\"files-btn\" class=\"ghost\" style=\"padding:.4rem .9rem;\">اختيار الملفات<\/button><span id=\"files-lbl\" class=\"hint\" style=\"opacity:.85;\">لم يتم اختيار أي ملف<\/span><\/p>\n        <input id=\"files-dir\" type=\"file\" webkitdirectory directory multiple style=\"display:none;\" />\n        <p style=\"margin:.3rem 0 .3rem;\"><button id=\"pick-dir\" class=\"ghost\">اختيار مجلد DICOM كامل بدل اختيار الملفات واحدًا واحدًا<\/button><\/p>\n        <p class=\"hint\" id=\"pick-hint\" style=\"margin:0 0 .6rem;\"><\/p>\n        <p>\n          <button id=\"upload\">رفع وتحليل<\/button>\n          <button id=\"demo\" class=\"ghost\">توليد ديمو<\/button>\n        <\/p>\n        <p class=\"hint\" id=\"ingest-status\"><\/p>\n        <p style=\"margin:.3rem 0 .2rem;\"><button id=\"import-report-btn\" class=\"ghost\" style=\"display:none;padding:.35rem .8rem;\">نسخ تقرير آخر استيراد<\/button><\/p>\n        <pre id=\"import-report\" dir=\"ltr\" style=\"display:none;white-space:pre-wrap;text-align:left;background:#0b1220;border:1px solid var(--line);border-radius:.5rem;padding:.6rem;font-size:.72rem;max-height:14rem;overflow:auto;\"><\/pre>\n        <details id=\"pacs-set\" style=\"margin:1rem 0;\">\n        <summary id=\"pacs-sum\" style=\"cursor:pointer;opacity:.85;\">سحب من PACS (DICOMweb)<\/summary>\n        <p style=\"margin:.6rem 0 .3rem;\"><input id=\"pacs-url\" type=\"text\" placeholder=\"https://pacs.hospital.local/dicom-web\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\" /><\/p>\n        <p style=\"margin:.3rem 0 .6rem;\"><input id=\"pacs-q\" type=\"text\" placeholder=\"معرف المريض (اختياري)\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\" /><\/p>\n        <p style=\"margin:.6rem 0 .3rem;\"><label id=\"lbl-dl-url\" for=\"pacs-dl-url\" style=\"opacity:.85;\">رابط التنزيل (WeTransfer / ZIP / DICOM)<\/label><\/p>\n        <p style=\"margin:.3rem 0 .6rem;\"><input id=\"pacs-dl-url\" type=\"text\" inputmode=\"url\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"https://we.tl/t-… أو https://…/study.zip أو https://…/study.dcm\" style=\"width:100%;padding:.5rem;border-radius:.4rem;border:1px solid #334155;background:#0b1220;color:#e2e8f0;\" /><\/p>\n        <button id=\"pacs-pull\" class=\"ghost\">سحب أول دراسة مطابقة<\/button>\n        <button id=\"pacs-dl\" class=\"ghost\" style=\"margin-inline-start:.5rem;\">سحب من رابط تنزيل (WeTransfer/ZIP/DICOM)<\/button>\n        <p class=\"hint\" id=\"pacs-status\"><\/p>\n        <p class=\"hint\" id=\"pacs-dl-hint\"><\/p>\n      <\/details>\n      <h2 id=\"h-worklist\">قائمة العمل (الحرج أولًا)<\/h2>\n        <div class=\"worklist-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"قائمة الحالات — Studies\">\n        <table id=\"worklist\">\n          <thead><tr><th id=\"th-patient\">المريض<\/th><th id=\"th-mod\">النوع<\/th><th id=\"th-date\">التاريخ<\/th><th id=\"th-pri\">الأولوية<\/th><th id=\"th-slices\">الشرائح<\/th><th><\/th><\/tr><\/thead>\n          <tbody><\/tbody>\n        <\/table>\n        <\/div>\n        <p class=\"empty\" id=\"empty\">لا توجد دراسات — ارفع DICOM أو اضغط \"توليد ديمو\".<\/p>\n        <details id=\"data-mgmt\" style=\"margin:.5rem 0 .2rem;\"><summary id=\"data-mgmt-sum\" class=\"ghost\" style=\"display:inline-block;padding:.4rem 1rem;cursor:pointer;\">إدارة البيانات ▾<\/summary>\n        <p style=\"margin:.4rem 0 .2rem;display:flex;gap:.5rem;flex-wrap:wrap;\"><button id=\"export-csv\" class=\"ghost\">تصدير القائمة CSV<\/button> <button id=\"clear-all\" class=\"ghost\">تفريغ القائمة من الجهاز<\/button><\/p><\/details>\n        <p class=\"hint\" id=\"hint-main\">⚙ كل المعالجة تحدث داخل متصفحك: لا سيرفر، لا إنترنت مطلوب بعد التثبيت، ولا بيانات تغادر جهازك. من قائمة المتصفح ⋮ ← \"إضافة إلى الشاشة الرئيسية\" لتثبيتها كتطبيق.<\/p>\n      <\/section>\n      <section class=\"viewer\" id=\"viewer-card\">\n        <h2 id=\"h-viewer\">العارض<\/h2>\n        <p id=\"prior-line\" style=\"display:none;margin:0 0 .3rem;color:#9fc3e8;font-size:.8rem;text-align:center;cursor:pointer;\"><\/p>\n        <p id=\"viewer-name\" style=\"margin:.2rem 0 .45rem;color:#e2e8f0;font-size:.88rem;text-align:center;direction:ltr;display:none;\"><\/p>\n        <div id=\"viewport\" style=\"display:none; position:relative; overflow:hidden; width:100%; background:#000; border-radius:.4rem; touch-action:none;\">\n          <div id=\"vwrap\" style=\"transform-origin:center; position:relative; width:max-content; margin:0 auto;\">\n            <canvas id=\"frame\" style=\"display:none; \"><\/canvas>\n            <canvas id=\"overlay\" style=\"position:absolute; inset:0; pointer-events:none; background:transparent;\"><\/canvas>\n          <\/div>\n          <canvas id=\"annot\" style=\"position:absolute; inset:0; pointer-events:none; display:block; background:transparent;\"><\/canvas>\n        <\/div>\n<div id=\"img-note\" style=\"display:none; margin:.45rem 0; padding:.55rem .7rem; border:1px solid #f59e0b; border-radius:.45rem; background:#2a1d06; color:#fde68a; font-size:.82rem; line-height:1.8; direction:ltr; text-align:left; word-break:break-word;\">\n          <span id=\"img-note-text\"><\/span>\n          <button id=\"img-note-copy\" class=\"ghost\" style=\"display:none; margin-top:.35rem;\">Copy diagnostics<\/button>\n        <\/div>\n          <div id=\"mpr-grid\" class=\"mpr-grid\" style=\"display:none\">\n          <div class=\"mpr-pane\" id=\"mpr-pane-axial\"><p class=\"mpr-lab\" id=\"mpr-lab-axial\">محوري<\/p><canvas id=\"mpr-c-axial\" width=\"8\" height=\"8\"><\/canvas><div class=\"mpr-ctl\"><input type=\"range\" id=\"mpr-slice-axial\" min=\"0\" max=\"0\" value=\"0\" step=\"1\" aria-label=\"slice Axial\" /><select id=\"mpr-preset-axial\" aria-label=\"window Axial\"><option value=\"auto\">تلقائي<\/option><option value=\"soft\">نسيج رخو<\/option><option value=\"mediastinum\">منصف<\/option><option value=\"bone\">عظم<\/option><option value=\"lung\">رئة<\/option><option value=\"brain\">دماغ<\/option><\/select><\/div><\/div>\n        <div id=\"all-grid\" style=\"display:none; width:100%;\"><\/div>\n          <div class=\"mpr-pane\" id=\"mpr-pane-coronal\"><p class=\"mpr-lab\" id=\"mpr-lab-coronal\">إكليلي<\/p><canvas id=\"mpr-c-coronal\" width=\"8\" height=\"8\"><\/canvas><div class=\"mpr-ctl\"><input type=\"range\" id=\"mpr-slice-coronal\" min=\"0\" max=\"0\" value=\"0\" step=\"1\" aria-label=\"slice Coronal\" /><select id=\"mpr-preset-coronal\" aria-label=\"window Coronal\"><option value=\"auto\">تلقائي<\/option><option value=\"soft\">نسيج رخو<\/option><option value=\"mediastinum\">منصف<\/option><option value=\"bone\">عظم<\/option><option value=\"lung\">رئة<\/option><option value=\"brain\">دماغ<\/option><\/select><\/div><\/div>\n          <div class=\"mpr-pane\" id=\"mpr-pane-sagittal\"><p class=\"mpr-lab\" id=\"mpr-lab-sagittal\">سهمي<\/p><canvas id=\"mpr-c-sagittal\" width=\"8\" height=\"8\"><\/canvas><div class=\"mpr-ctl\"><input type=\"range\" id=\"mpr-slice-sagittal\" min=\"0\" max=\"0\" value=\"0\" step=\"1\" aria-label=\"slice Sagittal\" /><select id=\"mpr-preset-sagittal\" aria-label=\"window Sagittal\"><option value=\"auto\">تلقائي<\/option><option value=\"soft\">نسيج رخو<\/option><option value=\"mediastinum\">منصف<\/option><option value=\"bone\">عظم<\/option><option value=\"lung\">رئة<\/option><option value=\"brain\">دماغ<\/option><\/select><\/div><\/div>\n        <\/div>\n                  <!-- v130 (2): the row a hand reaches for while reading a picture. -->\n        <div id=\"series-overview\" hidden aria-label=\"جميع السلاسل — All series\"><\/div>\n        <div class=\"controls\" id=\"viewer-bar\">\n          <button id=\"zoom-reset\" class=\"ghost\">ملاءمة<\/button>\n          <span id=\"zscale\" class=\"meta\" style=\"margin-inline-start:.5rem\"><\/span>\n          <button id=\"fs-toggle\" class=\"ghost\">ملء الشاشة<\/button>\n          <button id=\"vs-fold\" class=\"ghost\" type=\"button\" aria-expanded=\"false\" aria-controls=\"viewer-settings\" title=\"إعدادات العارض: القياس، الشريحة، النافذة، التدوير، السلاسل — Viewer settings\">⚙ إعدادات العارض ▾<\/button>\n        <\/div>\n        <div id=\"viewer-settings\" hidden>\n          <p class=\"hint\" id=\"vs-hint\" style=\"margin:.1rem 0 .35rem; font-size:.75rem;\">كل إعدادات العارض في مكان واحد — تُطوى ليأخذ التشريح الشاشة.<\/p>\n        <div class=\"controls\" id=\"measure-bar\">\n          <button id=\"measure\" class=\"ghost\">قياس<\/button>\n          <button id=\"cine-toggle\" class=\"ghost\">عرض متحرك<\/button>\n          <button id=\"id-toggle\" class=\"ghost\">إخفاء الهوية<\/button>\n          <span id=\"measure-out\"><\/span>\n        <\/div>\n          <div class=\"controls\">\n          <label id=\"lbl-slice\">الشريحة <input id=\"slice\" type=\"range\" min=\"0\" max=\"0\" value=\"0\" /><\/label>\n          <button id=\"redraw-btn\" class=\"ghost\" style=\"display:none;padding:.35rem .8rem;\">إعادة الرسم<\/button>\n          <label id=\"lbl-win\">النافذة:\n            <select id=\"preset\">\n              <option value=\"auto\">تلقائي<\/option>\n              <option value=\"soft\">نسيج رخو<\/option>\n              <option value=\"lung\">رئة<\/option>\n              <option value=\"mediastinum\">منصف<\/option>\n              <option value=\"bone\">عظم<\/option>\n              <option value=\"brain\">دماغ<\/option>\n            <\/select>\n          <\/label>\n        <\/div>\n<div class=\"controls\" id=\"orient-bar\">\n text);border:1px solid var(--line);border-radius:.4rem;padding:.3rem .5rem;\" />\n      <button id=\"org-save\" class=\"ghost\">حفظ الترويسة<\/button>\n    <\/div>\n  <\/details>\n<\/div>\n<div id=\"cmp-scrim\" style=\"display:none\" aria-hidden=\"true\"><\/div>\n<div id=\"cmp-sheet\" style=\"display:none\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"cmp-title\" aria-hidden=\"true\">\n  <div class=\"sheet-head\">\n    <b id=\"cmp-title\">مقارنة جنبًا إلى جنب<\/b>\n    <button id=\"cmp-close\" class=\"ghost\" type=\"button\" aria-label=\"إغلاق\">×<\/button>\n  <\/div>\n  <p class=\"controls\" id=\"cmp-pick-row\" style=\"margin:.2rem 0 .45rem\">\n    <label id=\"lbl-cmp-pick\">الدراسة الأخرى:\n      <select id=\"cmp-pick\"><\/select>\n    <\/label>\n  <\/p>\n  <div id=\"cmp-grid\">\n    <div class=\"cmp-pane\">\n      <div class=\"cmp-head\" id=\"cmp-head-a\"><\/div>\n      <canvas id=\"cmp-cv-a\" class=\"cmp-cv\"><\/canvas>\n      <input id=\"cmp-slice-a\" type=\"range\" min=\"0\" max=\"0\" value=\"0\" style=\"width:100%\">\n      <div class=\"cmp-sub\" id=\"cmp-sub-a\"><\/div>\n    <\/div>\n    <div class=\"cmp-pane\">\n      <div class=\"cmp-head\" id=\"cmp-head-b\"><\/div>\n      <canvas id=\"cmp-cv-b\" class=\"cmp-cv\"><\/canvas>\n      <input id=\"cmp-slice-b\" type=\"range\" min=\"0\" max=\"0\" value=\"0\" style=\"width:100%\">\n      <div class=\"cmp-sub\" id=\"cmp-sub-b\"><\/div>\n      <label id=\"lbl-win-b\">النافذة:\n        <select id=\"cmp-win-b\"><\/select>\n      <\/label>\n      <button id=\"cmp-open-b\" class=\"ghost\" type=\"button\" style=\"padding:.2rem .6rem;font-size:.78rem;margin-top:.3rem\">فتح هذه الدراسة<\/button>\n    <\/div>\n  <\/div>\n  <p class=\"controls\" id=\"cmp-bar\" style=\"margin:.5rem 0 .2rem\">\n    <label><input type=\"checkbox\" id=\"cmp-sync-slice\" checked> <span id=\"lbl-cmp-slice\">مزامنة الشريحة<\/span><\/label>\n    <label><input type=\"checkbox\" id=\"cmp-sync-zoom\" checked> <span id=\"lbl-cmp-zoom\">مزامنة <script>
(async () => {
  const boot = document.getElementById("boot");
  const say = (t) => { if (boot) boot.textContent = t; };
  try {
    const P = JSON.parse(document.getElementById("rrai-src").textContent);
    const S = P.src;
    const TOPO = ["consult", "decode", "dicom", "triage", "docx", "measure", "compare", "report", "mpr", "viewer-state", "app"];
    const urls = {};
    for (const n of TOPO) {
      let txt = S[n];
      for (const d of TOPO) {
        if (d === n || !urls[d]) continue;
        const rx = d === "decode"
          ? /(["'])\.\/codecs\/decode\.v\d+\.js\1/g
          : new RegExp("([\"'])\\.\\/" + d + "\\.v\\d+\\.js\\1", "g");
        txt = txt.replace(rx, '"' + urls[d] + '"');
      }
      const leftover = txt.match(/from\s*["']\.\//) || txt.match(/import\(\s*["']\.\//);
      if (leftover) throw new Error("unresolved-relative:" + n);
      urls[n] = URL.createObjectURL(new Blob([txt], { type: "text/javascript" }));
    }
    document.body.innerHTML = S.ui;
    say("بدء التطبيق…");
    const mod = await import(urls.app);
    await mod.init();
    const sp = document.getElementById("splash");
    if (sp) sp.remove();
    /* offline + updates: register this build's worker, evict older ones, reload on update */
    try {
      if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
        const reg = await navigator.serviceWorker.register("./sw.v130.js?b=v130", { scope: "./", updateViaCache: "none" });
        try {
          const all = await navigator.serviceWorker.getRegistrations();
          for (const r of all) if (r !== reg) { r.unregister().catch(() => {}); }
        } catch (e) {}
        navigator.serviceWorker.addEventListener("message", (ev) => {
          if (ev.data !== "rrai-sw-updated") return;
          try {
            if (sessionStorage.getItem("rrai-sw-reload")) return;
            sessionStorage.setItem("rrai-sw-reload", "1");
            location.reload();
          } catch (e) {}
        });
      }
    } catch (e) {}
  } catch (e) {
    say("تعذّر التشغيل — " + (e && e.message ? e.message : e));
    const d = document.createElement("div");
    d.className = "err";
    d.textContent = String(e && e.stack ? e.stack : e);
    document.body.appendChild(d);
  }
})();
</script>
